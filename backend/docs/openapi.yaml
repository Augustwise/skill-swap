openapi: 3.0.3
info:
  title: Skill Swap API
  version: 1.0.0
  description: |
    HTTP contract implemented by the Sprint 1-5 backend.

    Authentication (FR-01) uses an opaque server-side session stored in the HttpOnly
    `skillswap_session` cookie (SameSite=Lax, Path=/). Browsers should call the API through
    the frontend origin (the Next.js `/api/v1/*` rewrite) with `credentials: "include"`.

    Every POST, PATCH and DELETE must come from the configured frontend origin (`Origin`
    header) and send `Content-Type: application/json` when it has a body. Those requests
    that need a session must also send the `X-CSRF-Token` header returned by `/auth/login`
    and `/auth/me`.

    Profile endpoints (Sprint 3, FR-02 and FR-03) live under `/me`: the user always comes
    from the session, never from the path or the body, and must have a verified email.
    Unverified users receive 403 `email_not_verified`. Every successful change returns the
    whole updated profile, so the client can replace its copy.

    Discovery endpoints (Sprint 4, FR-04 and FR-05) also need a verified email. They never
    show the signed-in user, hidden profiles, suspended or deleted accounts, students with
    an unverified email, or anyone blocked in either direction. Lists have 20 items per
    page and are computed on every request, so profile and skill changes apply at once.

    Exchange requests (Sprint 5, FR-06 and FR-07) need a verified email. A request names
    one skill each student teaches the other, the format, and the number and length of
    sessions in each direction; both directions must add up to the same total time.
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local development
tags:
  - name: Service
  - name: Catalog
  - name: Auth
  - name: Profile
  - name: Discovery
  - name: Exchange requests
paths:
  /openapi.yaml:
    get:
      tags: [Service]
      operationId: getOpenAPI
      summary: Download this OpenAPI contract
      responses:
        "200":
          description: OpenAPI contract
          content:
            application/yaml:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/OriginForbidden"
  /health:
    get:
      tags: [Service]
      operationId: getHealth
      summary: Check whether the API process is running
      responses:
        "200":
          description: API process is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "403":
          $ref: "#/components/responses/OriginForbidden"
  /ready:
    get:
      tags: [Service]
      operationId: getReadiness
      summary: Check whether the database and required schema are available
      responses:
        "200":
          description: API is ready to serve database-backed requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /universities:
    get:
      tags: [Catalog]
      operationId: listUniversities
      summary: List universities ordered by name
      responses:
        "200":
          description: University catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/University"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /universities/{universityId}/faculties:
    get:
      tags: [Catalog]
      operationId: listFaculties
      summary: List faculties of a university ordered by name
      parameters:
        - name: universityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Faculties; an unknown university has none
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Faculty"
              example:
                items:
                  - id: 50000000-0000-0000-0000-000000000001
                    name: Факультет інформатики та обчислювальної техніки
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "404":
          description: universityId is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: not_found
                  message: Resource was not found
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /skill-categories:
    get:
      tags: [Catalog]
      operationId: listSkillCategories
      summary: List active skill categories in display order
      responses:
        "200":
          description: Skill category catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SkillCategory"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /skills:
    get:
      tags: [Catalog]
      operationId: listSkills
      summary: List or search active skills
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring matched against skill name or slug.
          required: false
          schema:
            type: string
            maxLength: 150
        - name: limit
          in: query
          description: Maximum number of returned skills.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Skill catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"
        "400":
          description: Invalid q or limit query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidQuery:
                  value:
                    error:
                      code: invalid_query
                      message: q must be 150 characters or fewer
                invalidLimit:
                  value:
                    error:
                      code: invalid_limit
                      message: limit must be between 1 and 100
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account with a university email and send a verification link
      description: |
        The email is trimmed and lower-cased. Its domain must be listed in
        ALLOWED_EMAIL_DOMAINS and belong to a university. The password must have at least
        12 characters and at most 72 UTF-8 bytes; longer values are rejected, never truncated.
        The verification link points to `{FRONTEND_ORIGIN}/verify-email?token=...` and is valid
        for 24 hours. This call does not sign the user in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [user, verificationEmailSent]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  verificationEmailSent:
                    type: boolean
                    description: False when SMTP failed; the user can sign in and resend the link.
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "409":
          description: The normalized email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: email_taken
                  message: An account with this email already exists
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in and receive the session cookie
      description: |
        Unverified users may sign in to check status, resend verification, or sign out.
        The frontend sends them to `/verify-email`; onboarding and all `/me` endpoints
        remain blocked until `user.emailVerified` is true.
        After 5 failed attempts for one email within 15 minutes,
        sign-in for that email is locked for 2 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: "skillswap_session=...; Path=/; HttpOnly; SameSite=Lax. With rememberMe=true, also includes Max-Age=604800 and Expires."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Email or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_credentials
                  message: Email or password is incorrect
        "403":
          description: Foreign origin (`origin_forbidden`) or suspended account (`account_suspended`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: Too many failed attempts
          headers:
            Retry-After:
              description: Seconds until sign-in is allowed again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: login_locked
                  message: Too many failed attempts. Try again later
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Return the signed-in user and the CSRF token for this session
      description: Call this on page load to restore the session and obtain the CSRF token.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session and clear the cookie
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFOrOriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm the email address with the token from the verification link
      description: A token works once. Used, replaced, or expired tokens return `invalid_token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [verified]
        "400":
          $ref: "#/components/responses/InvalidToken"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Send a new verification link to the signed-in user
      description: The new link invalidates previously sent verification links.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Email sent
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [sent]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFOrOriginForbidden"
        "409":
          description: The email is already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: email_already_verified
                  message: Email is already verified
        "503":
          description: Database (`database_unavailable`) or SMTP (`mail_unavailable`) is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Send a password reset link if an active account exists
      description: |
        Always answers 202 for a well-formed email so the response does not reveal whether an
        account exists. The link points to `{FRONTEND_ORIGIN}/reset-password?token=...`, is valid
        for 1 hour, and invalidates earlier reset links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [accepted]
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with the token from the reset link
      description: |
        On success every session of the user is revoked and a login lockout is lifted.
        The user then signs in with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [password_reset]
        "400":
          $ref: "#/components/responses/InvalidToken"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/profile:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: Return the signed-in user's profile with both skill lists
      security:
        - sessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    patch:
      tags: [Profile]
      operationId: updateMyProfile
      summary: Change some profile fields (FR-02)
      description: |
        Send only the fields to change; missing fields stay as they are. `null` clears
        `facultyId`, `course`, `city`, `bio` and `formats`. The university comes from the
        account email and cannot be changed. The whole result is validated: `city` is
        required when `formats` contains `OFFLINE`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
            example:
              firstName: Олена
              lastName: Коваль
              facultyId: 50000000-0000-0000-0000-000000000001
              course: 2
              city: Київ
              bio: Граю на гітарі 5 років, хочу навчитися Photoshop.
              formats: [ONLINE, OFFLINE]
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: One or more fields are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation_failed
                  message: Some fields are invalid
                  fields:
                    bio: Description must be at most 600 characters
                    city: City is required for offline lessons
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/teaching-skills:
    post:
      tags: [Profile]
      operationId: addTeachingSkill
      summary: Add a catalog skill to the "I teach" list
      description: "`level` is a self-assessment of the skill. A skill can be in each list once."
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/AddSkill"
      responses:
        "201":
          $ref: "#/components/responses/ProfileChanged"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/SkillNotFound"
        "409":
          $ref: "#/components/responses/SkillAlreadyAdded"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidLevel"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/teaching-skills/{skillId}:
    parameters:
      - $ref: "#/components/parameters/SkillID"
    patch:
      tags: [Profile]
      operationId: updateTeachingSkillLevel
      summary: Change the level of a skill in the "I teach" list
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SkillLevel"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/SkillNotInList"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidLevel"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    delete:
      tags: [Profile]
      operationId: removeTeachingSkill
      summary: Remove a skill from the "I teach" list
      description: The other list is not changed.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/SkillNotInList"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/learning-skills:
    post:
      tags: [Profile]
      operationId: addLearningSkill
      summary: Add a catalog skill to the "I learn" list
      description: "`level` is the current level of knowledge. A skill can be in each list once."
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/AddSkill"
      responses:
        "201":
          $ref: "#/components/responses/ProfileChanged"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/SkillNotFound"
        "409":
          $ref: "#/components/responses/SkillAlreadyAdded"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidLevel"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/learning-skills/{skillId}:
    parameters:
      - $ref: "#/components/parameters/SkillID"
    patch:
      tags: [Profile]
      operationId: updateLearningSkillLevel
      summary: Change the level of a skill in the "I learn" list
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SkillLevel"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/SkillNotInList"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidLevel"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    delete:
      tags: [Profile]
      operationId: removeLearningSkill
      summary: Remove a skill from the "I learn" list
      description: The other list is not changed.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/SkillNotInList"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/matches:
    get:
      tags: [Discovery]
      operationId: listMutualMatches
      summary: List the signed-in user's mutual matches (FR-05)
      description: |
        A student is a mutual match when each side teaches at least one catalog skill the
        other wants to learn, and both accept a common lesson format; offline counts only
        when both have the same city (LR1 3.2). Students with more matching skills (both
        directions together) come first; ties are ordered by first name, last name and ID.
        One-sided interest is not listed here. When the user's own profile is not eligible
        for matching (FR-03), `items` is empty and `eligibleForMatching` is false.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: One page of mutual matches; an empty `items` array means none were found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPage"
              example:
                items:
                  - student:
                      id: 60000000-0000-0000-0000-000000000002
                      firstName: Андрій
                      lastName: Коваль
                      university:
                        id: 10000000-0000-0000-0000-000000000001
                        name: Демонстраційний університет
                      city: Київ
                    canTeachYou:
                      - skillId: 30000000-0000-0000-0000-000000000002
                        categoryId: 20000000-0000-0000-0000-000000000002
                        name: Photoshop
                        level: ADVANCED
                    wantsToLearn:
                      - skillId: 30000000-0000-0000-0000-000000000001
                        categoryId: 20000000-0000-0000-0000-000000000001
                        name: Гітара
                        level: BEGINNER
                    commonFormats: [ONLINE, OFFLINE]
                page: 1
                pageSize: 20
                total: 1
                eligibleForMatching: true
        "400":
          $ref: "#/components/responses/InvalidPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /students:
    get:
      tags: [Discovery]
      operationId: searchStudents
      summary: Search students by an offered skill or a name (FR-04)
      description: |
        Returns visible students who offer at least one active skill. All filters apply
        together. `q` matches a part of an offered skill name or of the full name, case
        insensitive; `%` and `_` are plain characters. When `q` matches a skill name,
        `categoryId` and `level` must fit that same skill. One-sided interest is listed too;
        `mutual` marks students who are also mutual matches (see `/me/matches`), and they
        come first, then the order is by first name, last name and ID. An empty `items`
        array means nothing was found.
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: categoryId
          in: query
          required: false
          description: An offered skill must belong to this catalog category.
          schema:
            type: string
            format: uuid
        - name: level
          in: query
          required: false
          description: An offered skill must have this self-assessed level.
          schema:
            $ref: "#/components/schemas/SkillLevel"
        - name: format
          in: query
          required: false
          description: The student must accept this lesson format.
          schema:
            $ref: "#/components/schemas/LessonFormat"
        - name: mutual
          in: query
          required: false
          description: When true, only mutual matches are returned.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: One page of students
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSearchPage"
              example:
                items:
                  - student:
                      id: 60000000-0000-0000-0000-000000000003
                      firstName: Марко
                      lastName: Савчук
                      university:
                        id: 10000000-0000-0000-0000-000000000001
                        name: Демонстраційний університет
                      city: Львів
                    teachingSkills:
                      - skillId: 30000000-0000-0000-0000-000000000002
                        categoryId: 20000000-0000-0000-0000-000000000002
                        name: Photoshop
                        level: INTERMEDIATE
                    formats: [ONLINE]
                    mutual: false
                page: 1
                pageSize: 20
                total: 1
        "400":
          $ref: "#/components/responses/InvalidPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "422":
          description: A filter is invalid; `fields` names q, categoryId, level, format or mutual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation_failed
                  message: Some fields are invalid
                  fields:
                    level: Level must be BEGINNER, INTERMEDIATE or ADVANCED
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /students/{userId}:
    get:
      tags: [Discovery]
      operationId: getStudentProfile
      summary: Show another student's profile with skills, levels, formats and reviews (FR-05)
      description: |
        The same visibility rules as search apply; your own ID also returns 404 (use
        `/me/profile`). `mutual` explains the match when the student is a mutual match,
        otherwise it is null. `reviews` holds up to 20 newest reviews; `averageRating` is
        null while there are none.
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The student's profile
          content:
            application/json:
              schema:
                type: object
                required: [student]
                properties:
                  student:
                    $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: No visible student has this ID, or it is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: student_not_found
                  message: Student was not found
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /exchange-requests:
    post:
      tags: [Exchange requests]
      operationId: createExchangeRequest
      summary: Send an exchange request to another student (FR-06)
      description: |
        `teachSkillId` must be in your "I teach" list and in the recipient's "I learn" list;
        `learnSkillId` must be in the recipient's "I teach" list and in your "I learn" list.
        Both students must have `format`; OFFLINE also needs the same city. Only one request
        for the same pair of skills can wait for an answer, whoever sent it.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExchangeRequest"
            example:
              recipientId: 60000000-0000-0000-0000-000000000002
              teachSkillId: 30000000-0000-0000-0000-000000000001
              learnSkillId: 30000000-0000-0000-0000-000000000002
              format: ONLINE
              teachSessions: 2
              teachDurationMinutes: 60
              learnSessions: 2
              learnDurationMinutes: 60
              message: Привіт! Можу навчити акордів, хочу розібратися з шарами в Photoshop.
      responses:
        "201":
          description: The request is created and waits for an answer
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request:
                    $ref: "#/components/schemas/ExchangeRequest"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: No visible student has `recipientId`, or one of you blocked the other
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: student_not_found
                  message: Student was not found
        "409":
          description: |
            The recipient does not accept requests (`requests_closed`), accepts them only from
            their university (`same_university_only`), or a request for this pair of skills is
            already pending in either direction (`duplicate_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: duplicate_request
                  message: A request for these skills is already waiting for an answer
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: A field is invalid, a skill is not in the needed lists, or the format does not fit both students
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation_failed
                  message: Some fields are invalid
                  fields:
                    learnSessions: Both directions must have the same total time
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: skillswap_session
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number; each page has 20 items.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 1
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: The `csrfToken` value from `/auth/login` or `/auth/me`.
      schema:
        type: string
    SkillID:
      name: skillId
      in: path
      required: true
      description: Catalog skill id (`Skill.id`), not a row id of the list.
      schema:
        type: string
        format: uuid
  requestBodies:
    AddSkill:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AddSkillRequest"
          example:
            skillId: 30000000-0000-0000-0000-000000000001
            level: ADVANCED
    SkillLevel:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SkillLevelRequest"
          example:
            level: INTERMEDIATE
  examples:
    Profile:
      value:
        profile:
          id: 40000000-0000-0000-0000-000000000001
          firstName: Олена
          lastName: Коваль
          university:
            id: 10000000-0000-0000-0000-000000000001
            name: Демонстраційний університет
          faculty:
            id: 50000000-0000-0000-0000-000000000001
            name: Факультет інформатики та обчислювальної техніки
          course: 2
          city: Київ
          bio: Граю на гітарі 5 років, хочу навчитися Photoshop.
          formats: [ONLINE, OFFLINE]
          teachingSkills:
            - skillId: 30000000-0000-0000-0000-000000000001
              categoryId: 20000000-0000-0000-0000-000000000001
              name: Гітара
              level: ADVANCED
          learningSkills:
            - skillId: 30000000-0000-0000-0000-000000000002
              categoryId: 20000000-0000-0000-0000-000000000002
              name: Photoshop
              level: BEGINNER
          eligibleForMatching: true
  responses:
    InvalidPage:
      description: The page query parameter is not a whole number from 1 to 500
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: invalid_page
              message: page must be a whole number from 1 to 500
    Profile:
      description: The current profile
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileEnvelope"
          examples:
            profile:
              $ref: "#/components/examples/Profile"
    ProfileChanged:
      description: The skill was added; the body is the updated profile
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileEnvelope"
          examples:
            profile:
              $ref: "#/components/examples/Profile"
    SkillNotFound:
      description: The skill is not in the catalog, is inactive, or `skillId` is not a UUID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: skill_not_found
              message: Skill was not found in the catalog
    SkillNotInList:
      description: The skill is not in this list of the signed-in user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: skill_not_found
              message: Skill is not in this list
    SkillAlreadyAdded:
      description: The skill is already in this list
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: skill_already_added
              message: Skill is already in this list
    InvalidLevel:
      description: The level is not one of the allowed values
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: validation_failed
              message: Some fields are invalid
              fields:
                level: Level must be BEGINNER, INTERMEDIATE or ADVANCED
    Unauthenticated:
      description: The session cookie is missing, expired, or revoked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthenticated
              message: Sign in to continue
    ProfileForbidden:
      description: Unverified email (`email_not_verified`), invalid CSRF token (`csrf_invalid`), or foreign origin (`origin_forbidden`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: email_not_verified
              message: Verify your email to continue
    CSRFOrOriginForbidden:
      description: Missing or wrong X-CSRF-Token (`csrf_invalid`) or foreign origin (`origin_forbidden`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: csrf_invalid
              message: CSRF token is missing or invalid
    InvalidJSON:
      description: The body is not a single JSON object with the documented fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: invalid_json
              message: Request body must be a valid JSON object
    UnsupportedMediaType:
      description: The body is not sent as application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unsupported_media_type
              message: Content-Type must be application/json
    ValidationFailed:
      description: One or more fields are invalid; `fields` maps each field name to a message
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: validation_failed
              message: Some fields are invalid
              fields:
                password: Password must contain at least 12 characters
    InvalidToken:
      description: The link token is malformed, already used, replaced, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: invalid_token
              message: The link is invalid, already used, or expired
    OriginForbidden:
      description: Request Origin does not match the configured frontend origin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: origin_forbidden
              message: Origin is not allowed
    DatabaseUnavailable:
      description: PostgreSQL is unavailable or the required schema has not been applied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: database_unavailable
              message: Database is unavailable
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    University:
      type: object
      required: [id, name, shortName, emailDomain, city]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortName:
          type: string
        emailDomain:
          type: string
        city:
          type: string
    SkillCategory:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    Skill:
      type: object
      required: [id, categoryId, name, slug]
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    Faculty:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Reference:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SkillLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    LessonFormat:
      type: string
      enum: [ONLINE, OFFLINE]
    UserSkill:
      type: object
      required: [skillId, categoryId, name, level]
      properties:
        skillId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        level:
          $ref: "#/components/schemas/SkillLevel"
    Profile:
      type: object
      description: The owner's view of the profile; it has no email, password or account status.
      required: [id, firstName, lastName, university, faculty, course, city, bio, formats,
        teachingSkills, learningSkills, eligibleForMatching]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        university:
          $ref: "#/components/schemas/Reference"
        faculty:
          allOf:
            - $ref: "#/components/schemas/Reference"
          nullable: true
        course:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
        city:
          type: string
          description: Empty string when not set.
        bio:
          type: string
          description: Plain text; clients must display it without interpreting HTML.
        formats:
          type: array
          items:
            $ref: "#/components/schemas/LessonFormat"
        teachingSkills:
          type: array
          description: The "I teach" list, ordered by skill name.
          items:
            $ref: "#/components/schemas/UserSkill"
        learningSkills:
          type: array
          description: The "I learn" list, ordered by skill name.
          items:
            $ref: "#/components/schemas/UserSkill"
        eligibleForMatching:
          type: boolean
          description: True when both lists are filled, a format is chosen, and offline has a city.
    ProfileEnvelope:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        facultyId:
          type: string
          format: uuid
          nullable: true
          description: Must be a faculty of the user's university.
        course:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
        city:
          type: string
          maxLength: 100
          nullable: true
        bio:
          type: string
          maxLength: 600
          nullable: true
          description: Up to 600 characters (not bytes); line breaks are allowed.
        formats:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/LessonFormat"
    AddSkillRequest:
      type: object
      additionalProperties: false
      required: [skillId, level]
      properties:
        skillId:
          type: string
          format: uuid
        level:
          $ref: "#/components/schemas/SkillLevel"
    SkillLevelRequest:
      type: object
      additionalProperties: false
      required: [level]
      properties:
        level:
          $ref: "#/components/schemas/SkillLevel"
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: olena.koval@students.example.test
        password:
          type: string
          minLength: 12
          description: 12+ characters, at most 72 UTF-8 bytes
        firstName:
          type: string
          maxLength: 100
          example: Олена
        lastName:
          type: string
          maxLength: 100
          example: Коваль
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        rememberMe:
          type: boolean
          default: false
          description: Persist the cookie for seven days. If false, the cookie expires when the browser closes.
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: The `token` query parameter from the email link
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 12
          description: 12+ characters, at most 72 UTF-8 bytes
    User:
      type: object
      required: [id, email, firstName, lastName, universityId, role, emailVerified, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        universityId:
          type: string
          format: uuid
        role:
          type: string
          enum: [STUDENT, ADMIN]
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    SessionResponse:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: Send as the X-CSRF-Token header on POST requests that need a session.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              description: Field-level messages, present only for validation_failed.
              additionalProperties:
                type: string
    StudentSummary:
      type: object
      description: Another student's public card; it has no email or account status.
      required: [id, firstName, lastName, university, city]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        university:
          $ref: "#/components/schemas/Reference"
        city:
          type: string
          description: Empty string when not set.
    MutualMatch:
      type: object
      required: [student, canTeachYou, wantsToLearn, commonFormats]
      properties:
        student:
          $ref: "#/components/schemas/StudentSummary"
        canTeachYou:
          type: array
          description: The student's teaching skills that you want to learn, with the student's level; ordered by name.
          items:
            $ref: "#/components/schemas/UserSkill"
        wantsToLearn:
          type: array
          description: Your teaching skills that the student wants to learn, with the student's current level; ordered by name.
          items:
            $ref: "#/components/schemas/UserSkill"
        commonFormats:
          type: array
          description: Formats you can use together; OFFLINE appears only when you share a city.
          items:
            $ref: "#/components/schemas/LessonFormat"
    MatchPage:
      type: object
      required: [items, page, pageSize, total, eligibleForMatching]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MutualMatch"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          description: Number of matches on all pages.
        eligibleForMatching:
          type: boolean
          description: False when your own profile lacks a skill list, a format, or a city for offline lessons.
    StudentCard:
      type: object
      required: [student, teachingSkills, formats, mutual]
      properties:
        student:
          $ref: "#/components/schemas/StudentSummary"
        teachingSkills:
          type: array
          description: All skills the student offers, ordered by name.
          items:
            $ref: "#/components/schemas/UserSkill"
        formats:
          type: array
          items:
            $ref: "#/components/schemas/LessonFormat"
        mutual:
          type: boolean
          description: True when the student is also your mutual match.
    StudentSearchPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StudentCard"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          description: Number of students on all pages.
    Review:
      type: object
      required: [id, author, rating, comment, createdAt]
      properties:
        id:
          type: string
          format: uuid
        author:
          type: object
          required: [id, firstName, lastName]
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            lastName:
              type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          description: Plain text; empty string when there is no comment.
        createdAt:
          type: string
          format: date-time
    StudentProfile:
      type: object
      required: [id, firstName, lastName, university, faculty, course, city, bio, formats,
        teachingSkills, learningSkills, averageRating, reviewCount, reviews, mutual]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        university:
          $ref: "#/components/schemas/Reference"
        faculty:
          allOf:
            - $ref: "#/components/schemas/Reference"
          type: object
          nullable: true
        course:
          type: integer
          nullable: true
        city:
          type: string
        bio:
          type: string
          description: Plain text; clients must display it without interpreting HTML.
        formats:
          type: array
          items:
            $ref: "#/components/schemas/LessonFormat"
        teachingSkills:
          type: array
          items:
            $ref: "#/components/schemas/UserSkill"
        learningSkills:
          type: array
          items:
            $ref: "#/components/schemas/UserSkill"
        averageRating:
          type: number
          nullable: true
        reviewCount:
          type: integer
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        mutual:
          type: object
          nullable: true
          required: [canTeachYou, wantsToLearn, commonFormats]
          properties:
            canTeachYou:
              type: array
              items:
                $ref: "#/components/schemas/UserSkill"
            wantsToLearn:
              type: array
              items:
                $ref: "#/components/schemas/UserSkill"
            commonFormats:
              type: array
              items:
                $ref: "#/components/schemas/LessonFormat"
    CreateExchangeRequest:
      type: object
      additionalProperties: false
      required: [recipientId, teachSkillId, learnSkillId, format, teachSessions, teachDurationMinutes,
        learnSessions, learnDurationMinutes]
      properties:
        recipientId:
          type: string
          format: uuid
        teachSkillId:
          type: string
          format: uuid
          description: Catalog skill id that you teach the recipient.
        learnSkillId:
          type: string
          format: uuid
          description: Catalog skill id that the recipient teaches you; differs from `teachSkillId`.
        format:
          $ref: "#/components/schemas/LessonFormat"
        teachSessions:
          type: integer
          minimum: 1
          maximum: 20
        teachDurationMinutes:
          type: integer
          minimum: 15
          maximum: 240
        learnSessions:
          type: integer
          minimum: 1
          maximum: 20
          description: "`learnSessions × learnDurationMinutes` must equal `teachSessions × teachDurationMinutes`."
        learnDurationMinutes:
          type: integer
          minimum: 15
          maximum: 240
        message:
          type: string
          maxLength: 500
          description: Plain text; spaces around it are trimmed and an empty message is stored as null.
    RequestTerms:
      type: object
      description: One direction of the exchange with the students' current levels.
      required: [skill, teacherLevel, learnerLevel, sessions, durationMinutes]
      properties:
        skill:
          type: object
          required: [skillId, categoryId, name]
          properties:
            skillId:
              type: string
              format: uuid
            categoryId:
              type: string
              format: uuid
            name:
              type: string
        teacherLevel:
          $ref: "#/components/schemas/SkillLevel"
        learnerLevel:
          $ref: "#/components/schemas/SkillLevel"
        sessions:
          type: integer
        durationMinutes:
          type: integer
    ExchangeRequest:
      type: object
      description: The same for both participants.
      required: [id, status, format, totalSessions, message, requester, recipient, requesterTeaches,
        recipientTeaches, exchangeId, createdAt, respondedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, ACCEPTED, DECLINED, WITHDRAWN]
        format:
          $ref: "#/components/schemas/LessonFormat"
        totalSessions:
          type: integer
          description: Sessions in both directions.
        message:
          type: string
          nullable: true
          description: Plain text; clients must display it without interpreting HTML.
        requester:
          $ref: "#/components/schemas/StudentSummary"
        recipient:
          $ref: "#/components/schemas/StudentSummary"
        requesterTeaches:
          $ref: "#/components/schemas/RequestTerms"
        recipientTeaches:
          $ref: "#/components/schemas/RequestTerms"
        exchangeId:
          type: string
          format: uuid
          nullable: true
          description: The exchange created when the request is accepted.
        createdAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
          nullable: true
