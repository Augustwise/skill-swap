openapi: 3.0.3
info:
  title: Skill Swap API
  version: 1.0.0
  description: |
    HTTP contract implemented by the Sprint 1-7 backend.

    Authentication (FR-01) uses an opaque server-side session stored in the HttpOnly
    `skillswap_session` cookie (SameSite=Lax, Path=/). Browsers should call the API through
    the frontend origin (the Next.js `/api/v1/*` rewrite) with `credentials: "include"`.

    Every POST, PATCH and DELETE must come from the configured frontend origin (`Origin`
    header) and send `Content-Type: application/json` when it has a body. Those requests
    that need a session must also send the `X-CSRF-Token` header returned by `/auth/login`
    and `/auth/me`.

    Profile endpoints (Sprint 3, FR-02 and FR-03) live under `/me`: the user always comes
    from the session, never from the path or the body, and must have a verified email.
    Unverified users receive 403 `email_not_verified`. Every successful change returns the
    whole updated profile, so the client can replace its copy.

    Discovery endpoints (Sprint 4, FR-04 and FR-05) also need a verified email. They never
    show the signed-in user, hidden profiles, suspended or deleted accounts, students with
    an unverified email, or anyone blocked in either direction. Lists have 20 items per
    page and are computed on every request, so profile and skill changes apply at once.

    Exchange requests (Sprint 5, FR-06 and FR-07) need a verified email. A request names
    one skill each student teaches the other, the format, and the number and length of
    sessions in each direction; both directions must add up to the same total time.
    Accepting a request starts an exchange whose terms are copied from the students'
    profiles at that moment, so later profile changes do not alter it.

    Private text chat and in-app notifications (Sprint 6, FR-08 and FR-13) also need a
    verified email. Each exchange request has one private conversation shared by its two
    participants; when the request is accepted, the same conversation is linked to the
    created exchange so the discussion history is preserved. Open chats poll
    `GET /conversations/{conversationId}/messages?after={lastMessageId}` every 5 seconds
    without re-fetching the whole history. Notifications are stored in the same database
    transaction as the event with `UNIQUE (recipient_id, event_key)` so retries never
    create duplicates.

    Lesson planning, time agreement, active exchanges, and personal schedule (Sprint 7,
    FR-09 and FR-10) also need a verified email. Accepting an exchange request creates
    initial `DRAFT` lesson slots according to the agreed plan. Either participant of an
    active exchange can propose a topic, teacher, date, start/end time (with timezone),
    and meeting place or external video link; the partner accepts or declines the proposal.
    Rescheduling clears previous schedule confirmations and requires new agreement.
    Half-open intervals `[startsAt, endsAt)` are checked against all `SCHEDULED` sessions
    of both participants across all exchanges under canonical UUID user locks. Cancelled
    sessions do not increase progress and automatically add a replacement `DRAFT` slot.
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local development
tags:
  - name: Service
  - name: Catalog
  - name: Auth
  - name: Profile
  - name: Discovery
  - name: Exchange requests
  - name: Exchanges
  - name: Sessions
  - name: Conversations
  - name: Notifications
paths:
  /openapi.yaml:
    get:
      tags: [Service]
      operationId: getOpenAPI
      summary: Download this OpenAPI contract
      responses:
        "200":
          description: OpenAPI contract
          content:
            application/yaml:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/OriginForbidden"
  /health:
    get:
      tags: [Service]
      operationId: getHealth
      summary: Check whether the API process is running
      responses:
        "200":
          description: API process is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "403":
          $ref: "#/components/responses/OriginForbidden"
  /ready:
    get:
      tags: [Service]
      operationId: getReadiness
      summary: Check whether the database and required schema are available
      responses:
        "200":
          description: API is ready to serve database-backed requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /universities:
    get:
      tags: [Catalog]
      operationId: listUniversities
      summary: List universities ordered by name
      responses:
        "200":
          description: University catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/University"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /universities/{universityId}/faculties:
    get:
      tags: [Catalog]
      operationId: listFaculties
      summary: List faculties of a university ordered by name
      parameters:
        - name: universityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Faculties; an unknown university has none
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Faculty"
              example:
                items:
                  - id: 50000000-0000-0000-0000-000000000001
                    name: Факультет інформатики та обчислювальної техніки
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "404":
          description: universityId is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: not_found
                  message: Resource was not found
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /skill-categories:
    get:
      tags: [Catalog]
      operationId: listSkillCategories
      summary: List active skill categories in display order
      responses:
        "200":
          description: Skill category catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SkillCategory"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /skills:
    get:
      tags: [Catalog]
      operationId: listSkills
      summary: List or search active skills
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring matched against skill name or slug.
          required: false
          schema:
            type: string
            maxLength: 150
        - name: limit
          in: query
          description: Maximum number of returned skills.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Skill catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"
        "400":
          description: Invalid q or limit query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidQuery:
                  value:
                    error:
                      code: invalid_query
                      message: q must be 150 characters or fewer
                invalidLimit:
                  value:
                    error:
                      code: invalid_limit
                      message: limit must be between 1 and 100
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account with a university email and send a verification link
      description: |
        The email is trimmed and lower-cased. Its domain must be listed in
        ALLOWED_EMAIL_DOMAINS and belong to a university. The password must have at least
        12 characters and at most 72 UTF-8 bytes; longer values are rejected, never truncated.
        The verification link points to `{FRONTEND_ORIGIN}/verify-email?token=...` and is valid
        for 24 hours. This call does not sign the user in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [user, verificationEmailSent]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  verificationEmailSent:
                    type: boolean
                    description: False when SMTP failed; the user can sign in and resend the link.
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "409":
          description: The normalized email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: email_taken
                  message: An account with this email already exists
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in and receive the session cookie
      description: |
        Unverified users may sign in to check status, resend verification, or sign out.
        The frontend sends them to `/verify-email`; onboarding and all `/me` endpoints
        remain blocked until `user.emailVerified` is true.
        After 5 failed attempts for one email within 15 minutes,
        sign-in for that email is locked for 2 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: "skillswap_session=...; Path=/; HttpOnly; SameSite=Lax. With rememberMe=true, also includes Max-Age=604800 and Expires."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Email or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_credentials
                  message: Email or password is incorrect
        "403":
          description: Foreign origin (`origin_forbidden`) or suspended account (`account_suspended`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: Too many failed attempts
          headers:
            Retry-After:
              description: Seconds until sign-in is allowed again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: login_locked
                  message: Too many failed attempts. Try again later
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Return the signed-in user and the CSRF token for this session
      description: Call this on page load to restore the session and obtain the CSRF token.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session and clear the cookie
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFOrOriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm the email address with the token from the verification link
      description: A token works once. Used, replaced, or expired tokens return `invalid_token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [verified]
        "400":
          $ref: "#/components/responses/InvalidToken"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Send a new verification link to the signed-in user
      description: The new link invalidates previously sent verification links.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Email sent
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [sent]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFOrOriginForbidden"
        "409":
          description: The email is already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: email_already_verified
                  message: Email is already verified
        "503":
          description: Database (`database_unavailable`) or SMTP (`mail_unavailable`) is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Send a password reset link if an active account exists
      description: |
        Always answers 202 for a well-formed email so the response does not reveal whether an
        account exists. The link points to `{FRONTEND_ORIGIN}/reset-password?token=...`, is valid
        for 1 hour, and invalidates earlier reset links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [accepted]
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with the token from the reset link
      description: |
        On success every session of the user is revoked and a login lockout is lifted.
        The user then signs in with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [password_reset]
        "400":
          $ref: "#/components/responses/InvalidToken"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/profile:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: Return the signed-in user's profile with both skill lists
      security:
        - sessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    patch:
      tags: [Profile]
      operationId: updateMyProfile
      summary: Change some profile fields (FR-02)
      description: |
        Send only the fields to change; missing fields stay as they are. `null` clears
        `facultyId`, `course`, `city`, `bio` and `formats`. A new `universityId` clears the
        faculty unless `facultyId` of that university is sent too. The whole result is
        validated: `city` is required when `formats` contains `OFFLINE`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
            example:
              firstName: Олена
              lastName: Коваль
              facultyId: 50000000-0000-0000-0000-000000000001
              course: 2
              city: Київ
              bio: Граю на гітарі 5 років, хочу навчитися Photoshop.
              formats: [ONLINE, OFFLINE]
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: One or more fields are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation_failed
                  message: Some fields are invalid
                  fields:
                    bio: Description must be at most 600 characters
                    city: City is required for offline lessons
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/teaching-skills:
    post:
      tags: [Profile]
      operationId: addTeachingSkill
      summary: Add a catalog skill to the "I teach" list
      description: "`level` is a self-assessment of the skill. A skill can be in each list once."
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/AddSkill"
      responses:
        "201":
          $ref: "#/components/responses/ProfileChanged"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/SkillNotFound"
        "409":
          $ref: "#/components/responses/SkillAlreadyAdded"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidLevel"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/teaching-skills/{skillId}:
    parameters:
      - $ref: "#/components/parameters/SkillID"
    patch:
      tags: [Profile]
      operationId: updateTeachingSkillLevel
      summary: Change the level of a skill in the "I teach" list
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SkillLevel"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/SkillNotInList"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidLevel"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    delete:
      tags: [Profile]
      operationId: removeTeachingSkill
      summary: Remove a skill from the "I teach" list
      description: The other list is not changed.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/SkillNotInList"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/learning-skills:
    post:
      tags: [Profile]
      operationId: addLearningSkill
      summary: Add a catalog skill to the "I learn" list
      description: "`level` is the current level of knowledge. A skill can be in each list once."
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/AddSkill"
      responses:
        "201":
          $ref: "#/components/responses/ProfileChanged"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/SkillNotFound"
        "409":
          $ref: "#/components/responses/SkillAlreadyAdded"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidLevel"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/learning-skills/{skillId}:
    parameters:
      - $ref: "#/components/parameters/SkillID"
    patch:
      tags: [Profile]
      operationId: updateLearningSkillLevel
      summary: Change the level of a skill in the "I learn" list
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SkillLevel"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/SkillNotInList"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidLevel"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    delete:
      tags: [Profile]
      operationId: removeLearningSkill
      summary: Remove a skill from the "I learn" list
      description: The other list is not changed.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/SkillNotInList"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/matches:
    get:
      tags: [Discovery]
      operationId: listMutualMatches
      summary: List the signed-in user's mutual matches (FR-05)
      description: |
        A student is a mutual match when each side teaches at least one catalog skill the
        other wants to learn, and both accept a common lesson format; offline counts only
        when both have the same city (LR1 3.2). Students with more matching skills (both
        directions together) come first; ties are ordered by first name, last name and ID.
        One-sided interest is not listed here. When the user's own profile is not eligible
        for matching (FR-03), `items` is empty and `eligibleForMatching` is false.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: One page of mutual matches; an empty `items` array means none were found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPage"
              example:
                items:
                  - student:
                      id: 60000000-0000-0000-0000-000000000002
                      firstName: Андрій
                      lastName: Коваль
                      university:
                        id: 10000000-0000-0000-0000-000000000001
                        name: Демонстраційний університет
                      city: Київ
                    canTeachYou:
                      - skillId: 30000000-0000-0000-0000-000000000002
                        categoryId: 20000000-0000-0000-0000-000000000002
                        name: Photoshop
                        level: ADVANCED
                    wantsToLearn:
                      - skillId: 30000000-0000-0000-0000-000000000001
                        categoryId: 20000000-0000-0000-0000-000000000001
                        name: Гітара
                        level: BEGINNER
                    commonFormats: [ONLINE, OFFLINE]
                page: 1
                pageSize: 20
                total: 1
                eligibleForMatching: true
        "400":
          $ref: "#/components/responses/InvalidPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /students:
    get:
      tags: [Discovery]
      operationId: searchStudents
      summary: Search students by an offered skill or a name (FR-04)
      description: |
        Returns visible students who offer at least one active skill. All filters apply
        together. `q` matches a part of an offered skill name or of the full name, case
        insensitive; `%` and `_` are plain characters. When `q` matches a skill name,
        `categoryId` and `level` must fit that same skill. One-sided interest is listed too;
        `mutual` marks students who are also mutual matches (see `/me/matches`), and they
        come first, then the order is by first name, last name and ID. An empty `items`
        array means nothing was found.
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: categoryId
          in: query
          required: false
          description: An offered skill must belong to this catalog category.
          schema:
            type: string
            format: uuid
        - name: level
          in: query
          required: false
          description: An offered skill must have this self-assessed level.
          schema:
            $ref: "#/components/schemas/SkillLevel"
        - name: format
          in: query
          required: false
          description: The student must accept this lesson format.
          schema:
            $ref: "#/components/schemas/LessonFormat"
        - name: mutual
          in: query
          required: false
          description: When true, only mutual matches are returned.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: One page of students
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSearchPage"
              example:
                items:
                  - student:
                      id: 60000000-0000-0000-0000-000000000003
                      firstName: Марко
                      lastName: Савчук
                      university:
                        id: 10000000-0000-0000-0000-000000000001
                        name: Демонстраційний університет
                      city: Львів
                    teachingSkills:
                      - skillId: 30000000-0000-0000-0000-000000000002
                        categoryId: 20000000-0000-0000-0000-000000000002
                        name: Photoshop
                        level: INTERMEDIATE
                    formats: [ONLINE]
                    mutual: false
                page: 1
                pageSize: 20
                total: 1
        "400":
          $ref: "#/components/responses/InvalidPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "422":
          description: A filter is invalid; `fields` names q, categoryId, level, format or mutual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation_failed
                  message: Some fields are invalid
                  fields:
                    level: Level must be BEGINNER, INTERMEDIATE or ADVANCED
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /students/{userId}:
    get:
      tags: [Discovery]
      operationId: getStudentProfile
      summary: Show another student's profile with skills, levels, formats and reviews (FR-05)
      description: |
        The same visibility rules as search apply; your own ID also returns 404 (use
        `/me/profile`). `mutual` explains the match when the student is a mutual match,
        otherwise it is null. `reviews` holds up to 20 newest reviews; `averageRating` is
        null while there are none.
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The student's profile
          content:
            application/json:
              schema:
                type: object
                required: [student]
                properties:
                  student:
                    $ref: "#/components/schemas/StudentProfile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: No visible student has this ID, or it is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: student_not_found
                  message: Student was not found
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /exchange-requests:
    post:
      tags: [Exchange requests]
      operationId: createExchangeRequest
      summary: Send an exchange request to another student (FR-06)
      description: |
        `teachSkillId` must be in your "I teach" list and in the recipient's "I learn" list;
        `learnSkillId` must be in the recipient's "I teach" list and in your "I learn" list.
        Both students must have `format`; OFFLINE also needs the same city. Only one request
        for the same pair of skills can wait for an answer, whoever sent it.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExchangeRequest"
            example:
              recipientId: 60000000-0000-0000-0000-000000000002
              teachSkillId: 30000000-0000-0000-0000-000000000001
              learnSkillId: 30000000-0000-0000-0000-000000000002
              format: ONLINE
              teachSessions: 2
              teachDurationMinutes: 60
              learnSessions: 2
              learnDurationMinutes: 60
              message: Привіт! Можу навчити акордів, хочу розібратися з шарами в Photoshop.
      responses:
        "201":
          description: The request is created and waits for an answer
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request:
                    $ref: "#/components/schemas/ExchangeRequest"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: No visible student has `recipientId`, or one of you blocked the other
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: student_not_found
                  message: Student was not found
        "409":
          description: |
            The recipient does not accept requests (`requests_closed`), accepts them only from
            their university (`same_university_only`), or a request for this pair of skills is
            already pending in either direction (`duplicate_request`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: duplicate_request
                  message: A request for these skills is already waiting for an answer
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: A field is invalid, a skill is not in the needed lists, or the format does not fit both students
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation_failed
                  message: Some fields are invalid
                  fields:
                    learnSessions: Both directions must have the same total time
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/exchange-requests:
    get:
      tags: [Exchange requests]
      operationId: listExchangeRequests
      summary: List your incoming or sent exchange requests (FR-07)
      description: |
        `incoming` lists requests sent to you, `outgoing` the ones you sent. Newest come first.
        Requests stay in the list after the other student hides the profile or blocks you.
      security:
        - sessionCookie: []
      parameters:
        - name: direction
          in: query
          required: true
          schema:
            type: string
            enum: [incoming, outgoing]
        - name: status
          in: query
          required: false
          description: Only requests with this status; all statuses when omitted.
          schema:
            $ref: "#/components/schemas/RequestStatus"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: One page of requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRequestPage"
        "400":
          $ref: "#/components/responses/InvalidPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "422":
          description: "`direction` is missing or invalid, or `status` is unknown"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation_failed
                  message: Some fields are invalid
                  fields:
                    direction: Direction must be incoming or outgoing
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /exchange-requests/{requestId}:
    get:
      tags: [Exchange requests]
      operationId: getExchangeRequest
      summary: Show an exchange request with its status history (FR-07)
      description: |
        Only the two participants can see a request; they keep access after a block or a
        hidden profile.
      security:
        - sessionCookie: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The request and its status changes, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [request, history]
                properties:
                  request:
                    $ref: "#/components/schemas/ExchangeRequest"
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/RequestStatusChange"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: No request has this ID, you do not take part in it, or the ID is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: request_not_found
                  message: Request was not found
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /exchange-requests/{requestId}/accept:
    post:
      tags: [Exchange requests]
      operationId: acceptExchangeRequest
      summary: Accept a request sent to you and start the exchange (FR-07)
      description: |
        Only the recipient can accept a request, and only while it is `PENDING`. The request
        becomes ACCEPTED and an ACTIVE exchange is created in the same transaction, with the
        skill names and levels copied as they are now. Repeating the action, or two
        acceptances at the same time, return 200 with the same exchange; a second exchange is
        never created. The request has no body.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The accepted request and the exchange it started
          content:
            application/json:
              schema:
                type: object
                required: [request, exchange]
                properties:
                  request:
                    $ref: "#/components/schemas/ExchangeRequest"
                  exchange:
                    $ref: "#/components/schemas/Exchange"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            You are the requester and cannot accept (`action_not_allowed`), or the email is
            unverified (`email_not_verified`), the CSRF token is invalid (`csrf_invalid`) or
            the origin is foreign (`origin_forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: action_not_allowed
                  message: This action is not available for your role in the request
        "404":
          description: No request has this ID, you do not take part in it, or the ID is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: request_not_found
                  message: Request was not found
        "409":
          description: |
            The request has already been declined or withdrawn (`request_not_pending`), or it
            can no longer be accepted (`request_outdated`): one of the students blocked the
            other, an account is suspended or deleted, or one of the four skills was removed
            from a profile. An outdated request stays PENDING, so its author can withdraw it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notPending:
                  value:
                    error:
                      code: request_not_pending
                      message: The request has already been answered
                outdated:
                  value:
                    error:
                      code: request_outdated
                      message: "The request can no longer be accepted: a student or one of the skills is no longer available"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /exchange-requests/{requestId}/decline:
    post:
      tags: [Exchange requests]
      operationId: declineExchangeRequest
      summary: Decline a request sent to you (FR-07)
      description: |
        Only the recipient can decline a request, and only while it is `PENDING`. Repeating
        the action on a request that is already DECLINED returns 200 with the current
        request and adds nothing to its history, so a retry after a lost response is safe.
        The request has no body.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The request after the change
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request:
                    $ref: "#/components/schemas/ExchangeRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            You are the requester and cannot decline (`action_not_allowed`; the requester can
            withdraw instead), or the email is unverified (`email_not_verified`), the
            CSRF token is invalid (`csrf_invalid`) or the origin is foreign (`origin_forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: action_not_allowed
                  message: This action is not available for your role in the request
        "404":
          description: No request has this ID, you do not take part in it, or the ID is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: request_not_found
                  message: Request was not found
        "409":
          description: The request has already been accepted, declined or withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: request_not_pending
                  message: The request has already been answered
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /exchange-requests/{requestId}/withdraw:
    post:
      tags: [Exchange requests]
      operationId: withdrawExchangeRequest
      summary: Withdraw a request you sent (FR-07)
      description: |
        Only the requester can withdraw a request, and only while it is `PENDING`. Repeating
        the action on a request that is already WITHDRAWN returns 200 with the current
        request and adds nothing to its history, so a retry after a lost response is safe.
        The request has no body.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The request after the change
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request:
                    $ref: "#/components/schemas/ExchangeRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            You are the recipient and cannot withdraw (`action_not_allowed`; the recipient can
            decline instead), or the email is unverified (`email_not_verified`), the
            CSRF token is invalid (`csrf_invalid`) or the origin is foreign (`origin_forbidden`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: action_not_allowed
                  message: This action is not available for your role in the request
        "404":
          description: No request has this ID, you do not take part in it, or the ID is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: request_not_found
                  message: Request was not found
        "409":
          description: The request has already been accepted, declined or withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: request_not_pending
                  message: The request has already been answered
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/exchanges:
    get:
      tags: [Exchanges]
      operationId: listMyExchanges
      summary: List your exchanges with progress and nearest scheduled meeting (FR-10)
      description: |
        Returns 20 exchanges per page, with `ACTIVE` exchanges first and then ordered by
        latest activity. Each item includes `partner`, both skill directions from the
        acceptance snapshots, `progress` (completed vs planned sessions, excluding
        cancelled sessions) and `nextSession` (the earliest upcoming `SCHEDULED` meeting,
        or null).
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          description: Optional status filter (`ACTIVE`, `COMPLETED` or `CANCELLED`).
          schema:
            type: string
            enum: [ACTIVE, COMPLETED, CANCELLED]
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: One page of exchanges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangePage"
        "400":
          $ref: "#/components/responses/InvalidPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "422":
          description: "`status` is not `ACTIVE`, `COMPLETED` or `CANCELLED`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /exchanges/{exchangeId}:
    get:
      tags: [Exchanges]
      operationId: getExchange
      summary: Show the terms, progress, sessions and status history of an exchange (FR-07, FR-10, FR-11)
      description: |
        Only the two participants can see an exchange. The terms come from the snapshots
        taken on acceptance; `sessions` lists all planned and cancelled lessons in
        `planOrder` order; `history` lists the status changes oldest first, including who
        completed or cancelled the exchange and the cancellation reason.
      security:
        - sessionCookie: []
      parameters:
        - name: exchangeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The exchange and its sessions
          content:
            application/json:
              schema:
                type: object
                required: [exchange, sessions, history]
                properties:
                  exchange:
                    $ref: "#/components/schemas/Exchange"
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
                  history:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExchangeStatusChange"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: No exchange has this ID, you do not take part in it, or the ID is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: exchange_not_found
                  message: Exchange was not found
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /exchanges/{exchangeId}/complete:
    post:
      tags: [Exchanges]
      operationId: completeExchange
      summary: Confirm that the exchange is finished (FR-11)
      description: |
        Available when every planned session in both directions is `COMPLETED`
        (`progress.planCompleted`). The first participant's call records their confirmation
        and notifies the partner; the exchange stays `ACTIVE`. The partner's call sets
        `COMPLETED`, `completedAt` and a history item. Repeating the call, or calling it on a
        completed exchange, returns the exchange as it is. Takes no body.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: exchangeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The exchange after the confirmation
          content:
            application/json:
              schema:
                type: object
                required: [exchange]
                properties:
                  exchange:
                    $ref: "#/components/schemas/Exchange"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: Exchange was not found (`exchange_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`exchange_not_active` (cancelled), `exchange_blocked` or `plan_not_completed`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: plan_not_completed
                  message: Not all planned sessions have been confirmed in both directions
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /exchanges/{exchangeId}/cancel:
    post:
      tags: [Exchanges]
      operationId: cancelExchange
      summary: Cancel an active exchange with a reason (FR-11)
      description: |
        Either participant can cancel an `ACTIVE` exchange. In one transaction the exchange
        becomes `CANCELLED` with `cancelledAt`, the reason and a history item; every
        `DRAFT`, `PROPOSED` and `SCHEDULED` session becomes `CANCELLED` with the same reason
        and pending proposals are superseded. Completed sessions and all history stay. The
        partner gets a `SESSION_UPDATED` notification that opens the exchange. Repeating the
        call on a cancelled exchange returns it as it is.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: exchangeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelExchangeRequest"
      responses:
        "200":
          description: The cancelled exchange
          content:
            application/json:
              schema:
                type: object
                required: [exchange]
                properties:
                  exchange:
                    $ref: "#/components/schemas/Exchange"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: Exchange was not found (`exchange_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`exchange_not_active`: the exchange is already completed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /exchanges/{exchangeId}/sessions:
    parameters:
      - name: exchangeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Sessions]
      operationId: listExchangeSessions
      summary: List all sessions of an exchange ordered by planOrder (FR-09, FR-10)
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The exchange and its sessions
          content:
            application/json:
              schema:
                type: object
                required: [exchange, items]
                properties:
                  exchange:
                    $ref: "#/components/schemas/Exchange"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: No exchange has this ID, you do not take part in it, or the ID is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      tags: [Sessions]
      operationId: proposeExchangeSession
      summary: Propose a lesson topic, teacher, time and place or link in an active exchange (FR-09)
      description: |
        When `sessionId` is omitted, the server picks the first `DRAFT` slot for
        `teacherId` in this exchange. In one transaction it locks both participants in
        UUID order, checks that neither has a conflicting `SCHEDULED` session in
        `[startsAt, endsAt)`, records the proposer's `SCHEDULE` confirmation, stores a
        `PENDING` proposal, sets the session to `PROPOSED`, and records a
        `SESSION_UPDATED` notification for the partner.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeSessionRequest"
      responses:
        "201":
          description: Lesson proposal created
          content:
            application/json:
              schema:
                type: object
                required: [session, proposal]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
                  proposal:
                    $ref: "#/components/schemas/SessionProposal"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: Exchange or session was not found (`exchange_not_found` or `session_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            `exchange_not_active`, `exchange_blocked`, `plan_limit_reached`,
            `session_not_schedulable`, or `session_conflict`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /sessions/{sessionId}:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Show a session and its proposal history (FR-09, FR-10)
      description: Only the two participants of the session's exchange can see it.
      security:
        - sessionCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Session details and chronological proposal history
          content:
            application/json:
              schema:
                type: object
                required: [session, proposals]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
                  proposals:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionProposal"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: No session has this ID, you do not take part in it, or the ID is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: session_not_found
                  message: Session was not found
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /sessions/{sessionId}/proposals:
    post:
      tags: [Sessions]
      operationId: proposeSession
      summary: Propose a schedule or reschedule a specific session (FR-09)
      description: |
        Proposes time and location/link on a `DRAFT` session or reschedules a `PROPOSED`
        or `SCHEDULED` session. Rescheduling clears previous `SCHEDULE` confirmations and
        requires the partner's new acceptance (LR2 5.3).
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeSessionRequest"
      responses:
        "201":
          description: Schedule proposal saved
          content:
            application/json:
              schema:
                type: object
                required: [session, proposal]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
                  proposal:
                    $ref: "#/components/schemas/SessionProposal"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: Session was not found (`session_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            `exchange_not_active`, `exchange_blocked`, `plan_limit_reached`,
            `session_not_schedulable`, or `session_conflict`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /sessions/{sessionId}/accept:
    post:
      tags: [Sessions]
      operationId: acceptSessionProposal
      summary: Accept the partner's pending schedule proposal (FR-09)
      description: |
        Only the recipient of the pending proposal can accept it. Locks both participants
        in UUID order, verifies that the start time is still in the future and neither
        participant has an overlapping `SCHEDULED` session (`[startsAt, endsAt)`), records
        the second `SCHEDULE` confirmation, sets the session to `SCHEDULED`, and notifies
        the proposer. Repeating the call is idempotent. Takes no body.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Session scheduled
          content:
            application/json:
              schema:
                type: object
                required: [session, proposal]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
                  proposal:
                    $ref: "#/components/schemas/SessionProposal"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`action_not_allowed` (proposer cannot accept own proposal), `email_not_verified`, `csrf_invalid`, or `origin_forbidden`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session was not found (`session_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`exchange_not_active`, `exchange_blocked`, `session_not_proposed`, `session_in_past`, or `session_conflict`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /sessions/{sessionId}/decline:
    post:
      tags: [Sessions]
      operationId: declineSessionProposal
      summary: Decline the partner's pending schedule proposal (FR-09)
      description: |
        Only the recipient of the pending proposal can decline it. Marks the proposal
        `DECLINED`, clears schedule confirmations, resets the session back to `DRAFT`, and
        notifies the proposer. Repeating the call is idempotent. Takes no body.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Proposal declined and session returned to DRAFT
          content:
            application/json:
              schema:
                type: object
                required: [session, proposal]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
                  proposal:
                    $ref: "#/components/schemas/SessionProposal"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: "`action_not_allowed`, `email_not_verified`, `csrf_invalid`, or `origin_forbidden`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session was not found (`session_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`exchange_not_active` or `session_not_proposed`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /sessions/{sessionId}/cancel:
    post:
      tags: [Sessions]
      operationId: cancelSession
      summary: Cancel a proposed or scheduled session (FR-09, FR-10)
      description: |
        Either participant can cancel a `PROPOSED` or `SCHEDULED` session. Cancelled
        sessions do not increase progress and automatically add a replacement `DRAFT` slot
        so the agreed plan can still be completed. Repeating the call is idempotent.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelSessionRequest"
      responses:
        "200":
          description: Session cancelled
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: Session was not found (`session_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`exchange_not_active` or `session_not_cancellable`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /sessions/{sessionId}/confirm:
    post:
      tags: [Sessions]
      operationId: confirmSessionCompletion
      summary: Confirm that a session took place (FR-11)
      description: |
        After `endsAt` each participant confirms a `SCHEDULED` session. One confirmation
        does not count the session; the second one sets `COMPLETED` and `completedAt`, so
        the session is added to `progress`. The partner gets a `SESSION_UPDATED`
        notification. Repeating the call, or calling it on a completed session, changes
        nothing. Rescheduling or cancelling the session clears its confirmations. Takes no
        body.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The session and its exchange with the updated progress
          content:
            application/json:
              schema:
                type: object
                required: [session, exchange]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
                  exchange:
                    $ref: "#/components/schemas/Exchange"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: Session was not found (`session_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "`exchange_not_active`, `exchange_blocked`, `session_not_confirmable` (not `SCHEDULED`) or `session_not_finished`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: session_not_finished
                  message: The session can be confirmed only after it ends
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/schedule:
    get:
      tags: [Sessions]
      operationId: listMySchedule
      summary: List your scheduled meetings in chronological order (FR-10)
      description: |
        Returns only sessions where the signed-in student is the teacher or learner,
        ordered chronologically by `startsAt` ascending, 20 per page. By default only
        `SCHEDULED` meetings are returned; pass `status=PROPOSED|COMPLETED|CANCELLED|ALL`
        to inspect other states, or `upcoming=true` to filter `endsAt >= now()`.
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by session status; defaults to `SCHEDULED`.
          schema:
            type: string
            enum: [SCHEDULED, PROPOSED, COMPLETED, CANCELLED, ALL]
            default: SCHEDULED
        - name: upcoming
          in: query
          required: false
          description: When true, only sessions whose `endsAt` has not passed are returned.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: Chronological schedule page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePage"
        "400":
          $ref: "#/components/responses/InvalidPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /exchange-requests/{requestId}/conversation:
    get:
      tags: [Conversations]
      operationId: getRequestConversation
      summary: Open the private conversation of an exchange request (FR-08)
      description: |
        Returns the private conversation between the requester and the recipient. Only the
        two participants can open it; after the request is accepted, this returns the same
        conversation now linked to the exchange.
      security:
        - sessionCookie: []
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The conversation of the request
          content:
            application/json:
              schema:
                type: object
                required: [conversation]
                properties:
                  conversation:
                    $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: No request has this ID, you do not take part in it, or the ID is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: request_not_found
                  message: Request was not found
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /exchanges/{exchangeId}/conversation:
    get:
      tags: [Conversations]
      operationId: getExchangeConversation
      summary: Open the private conversation of an exchange (FR-08)
      description: |
        Returns the private conversation of the exchange, preserving all messages sent
        while the request was pending. Only the two participants can open it.
      security:
        - sessionCookie: []
      parameters:
        - name: exchangeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The conversation of the exchange
          content:
            application/json:
              schema:
                type: object
                required: [conversation]
                properties:
                  conversation:
                    $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: No exchange has this ID, you do not take part in it, or the ID is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: exchange_not_found
                  message: Exchange was not found
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/conversations:
    get:
      tags: [Conversations]
      operationId: listMyConversations
      summary: List your private conversations ordered by latest activity (FR-08)
      description: |
        Returns 20 conversations per page, newest message (or creation time) first. Each
        item includes `partner` (the other student), both skill directions, `lastMessage`,
        `unreadCount` and `canSend`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: One page of conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "400":
          $ref: "#/components/responses/InvalidPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /conversations/{conversationId}:
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Show a private conversation by ID (FR-08)
      description: |
        Checks membership in `conversation_participants`. Anyone except the two participants
        receives 404 `conversation_not_found`.
      security:
        - sessionCookie: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The conversation
          content:
            application/json:
              schema:
                type: object
                required: [conversation]
                properties:
                  conversation:
                    $ref: "#/components/schemas/Conversation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/ConversationNotFound"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /conversations/{conversationId}/messages:
    parameters:
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Conversations]
      operationId: listConversationMessages
      summary: List or poll messages in a private conversation (FR-08, NFR-02)
      description: |
        Messages are ordered chronologically (oldest first), 20 per page. When `after` is
        provided (the ID of the last seen message in this conversation), only newer messages
        are returned so the open chat can poll every 5 seconds without re-fetching the whole
        history.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - name: after
          in: query
          required: false
          description: Return only messages created after this message ID in the same conversation.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Messages in chronological order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "400":
          $ref: "#/components/responses/InvalidPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/ConversationNotFound"
        "422":
          description: "`after` is not a valid message ID in this conversation or is combined with `page > 1`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation_failed
                  message: Some fields are invalid
                  fields:
                    after: Choose a message from this conversation
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    post:
      tags: [Conversations]
      operationId: sendConversationMessage
      summary: Send a text message in a private conversation (FR-08)
      description: |
        `body` is plain text (links and line breaks are allowed), trimmed, from 1 to 2000
        characters. In one transaction the server locks both participants in UUID order,
        checks membership and blocks, stores the message, updates `last_message_at`, and
        creates a `CHAT_MESSAGE` notification for the other participant.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
            example:
              body: Привіт! Домовимося про перше заняття в середу о 18:00?
      responses:
        "201":
          description: Message stored
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/ConversationNotFound"
        "409":
          description: One of the participants blocked the other or an account is no longer active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: conversation_blocked
                  message: New messages cannot be sent in this conversation
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: "`body` is empty, longer than 2000 characters, or contains control characters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation_failed
                  message: Some fields are invalid
                  fields:
                    body: Message must be between 1 and 2000 characters
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /conversations/{conversationId}/read:
    post:
      tags: [Conversations]
      operationId: markConversationRead
      summary: Mark incoming messages in a conversation as read (FR-08, FR-13)
      description: |
        Records read receipts for all unread incoming messages in the conversation and marks
        unread `CHAT_MESSAGE` notifications for this conversation as read. Takes no body.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated conversation and number of newly read messages
          content:
            application/json:
              schema:
                type: object
                required: [conversation, readCount]
                properties:
                  conversation:
                    $ref: "#/components/schemas/Conversation"
                  readCount:
                    type: integer
                    minimum: 0
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          $ref: "#/components/responses/ConversationNotFound"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/notifications:
    get:
      tags: [Notifications]
      operationId: listMyNotifications
      summary: List your in-app notifications and unread counter (FR-13)
      description: |
        Returns 20 notifications per page, newest first, together with `unreadCount` (the
        total number of unread notifications for the signed-in user). Pass `unreadOnly=true`
        to list only unread items.
      security:
        - sessionCookie: []
      parameters:
        - name: unreadOnly
          in: query
          required: false
          description: When true, only unread notifications (`readAt == null`) are returned.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: One page of notifications and current unread counter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "400":
          $ref: "#/components/responses/InvalidPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "422":
          description: "`unreadOnly` is not `true` or `false`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation_failed
                  message: Some fields are invalid
                  fields:
                    unreadOnly: unreadOnly must be true or false
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark a notification as read and return the updated unread counter (FR-13)
      description: |
        Only the recipient of the notification can mark it read. Repeating the call on an
        already-read notification is idempotent. Takes no body.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The read notification and updated unread counter
          content:
            application/json:
              schema:
                type: object
                required: [notification, unreadCount]
                properties:
                  notification:
                    $ref: "#/components/schemas/Notification"
                  unreadCount:
                    type: integer
                    minimum: 0
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "404":
          description: No notification has this ID, it does not belong to you, or the ID is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: notification_not_found
                  message: Notification was not found
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all of your unread notifications as read (FR-13)
      description: Marks every unread notification of the signed-in user as read. Takes no body.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: Number of newly marked notifications and updated unread counter (0)
          content:
            application/json:
              schema:
                type: object
                required: [markedCount, unreadCount]
                properties:
                  markedCount:
                    type: integer
                    minimum: 0
                  unreadCount:
                    type: integer
                    example: 0
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ProfileForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: skillswap_session
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number; each page has 20 items.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 1
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: The `csrfToken` value from `/auth/login` or `/auth/me`.
      schema:
        type: string
    SkillID:
      name: skillId
      in: path
      required: true
      description: Catalog skill id (`Skill.id`), not a row id of the list.
      schema:
        type: string
        format: uuid
  requestBodies:
    AddSkill:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AddSkillRequest"
          example:
            skillId: 30000000-0000-0000-0000-000000000001
            level: ADVANCED
    SkillLevel:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SkillLevelRequest"
          example:
            level: INTERMEDIATE
  examples:
    Profile:
      value:
        profile:
          id: 40000000-0000-0000-0000-000000000001
          firstName: Олена
          lastName: Коваль
          university:
            id: 10000000-0000-0000-0000-000000000001
            name: Демонстраційний університет
          faculty:
            id: 50000000-0000-0000-0000-000000000001
            name: Факультет інформатики та обчислювальної техніки
          course: 2
          city: Київ
          bio: Граю на гітарі 5 років, хочу навчитися Photoshop.
          formats: [ONLINE, OFFLINE]
          teachingSkills:
            - skillId: 30000000-0000-0000-0000-000000000001
              categoryId: 20000000-0000-0000-0000-000000000001
              name: Гітара
              level: ADVANCED
          learningSkills:
            - skillId: 30000000-0000-0000-0000-000000000002
              categoryId: 20000000-0000-0000-0000-000000000002
              name: Photoshop
              level: BEGINNER
          eligibleForMatching: true
  responses:
    InvalidPage:
      description: The page query parameter is not a whole number from 1 to 500
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: invalid_page
              message: page must be a whole number from 1 to 500
    Profile:
      description: The current profile
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileEnvelope"
          examples:
            profile:
              $ref: "#/components/examples/Profile"
    ProfileChanged:
      description: The skill was added; the body is the updated profile
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileEnvelope"
          examples:
            profile:
              $ref: "#/components/examples/Profile"
    SkillNotFound:
      description: The skill is not in the catalog, is inactive, or `skillId` is not a UUID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: skill_not_found
              message: Skill was not found in the catalog
    SkillNotInList:
      description: The skill is not in this list of the signed-in user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: skill_not_found
              message: Skill is not in this list
    SkillAlreadyAdded:
      description: The skill is already in this list
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: skill_already_added
              message: Skill is already in this list
    InvalidLevel:
      description: The level is not one of the allowed values
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: validation_failed
              message: Some fields are invalid
              fields:
                level: Level must be BEGINNER, INTERMEDIATE or ADVANCED
    Unauthenticated:
      description: The session cookie is missing, expired, or revoked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthenticated
              message: Sign in to continue
    ProfileForbidden:
      description: Unverified email (`email_not_verified`), invalid CSRF token (`csrf_invalid`), or foreign origin (`origin_forbidden`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: email_not_verified
              message: Verify your email to continue
    CSRFOrOriginForbidden:
      description: Missing or wrong X-CSRF-Token (`csrf_invalid`) or foreign origin (`origin_forbidden`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: csrf_invalid
              message: CSRF token is missing or invalid
    InvalidJSON:
      description: The body is not a single JSON object with the documented fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: invalid_json
              message: Request body must be a valid JSON object
    UnsupportedMediaType:
      description: The body is not sent as application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unsupported_media_type
              message: Content-Type must be application/json
    ValidationFailed:
      description: One or more fields are invalid; `fields` maps each field name to a message
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: validation_failed
              message: Some fields are invalid
              fields:
                password: Password must contain at least 12 characters
    InvalidToken:
      description: The link token is malformed, already used, replaced, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: invalid_token
              message: The link is invalid, already used, or expired
    OriginForbidden:
      description: Request Origin does not match the configured frontend origin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: origin_forbidden
              message: Origin is not allowed
    DatabaseUnavailable:
      description: PostgreSQL is unavailable or the required schema has not been applied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: database_unavailable
              message: Database is unavailable
    ConversationNotFound:
      description: No conversation has this ID, you do not take part in it, or the ID is not a UUID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: conversation_not_found
              message: Conversation was not found
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    University:
      type: object
      required: [id, name, shortName, emailDomain, city]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortName:
          type: string
        emailDomain:
          type: string
        city:
          type: string
    SkillCategory:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    Skill:
      type: object
      required: [id, categoryId, name, slug]
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    Faculty:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Reference:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SkillLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    LessonFormat:
      type: string
      enum: [ONLINE, OFFLINE]
    UserSkill:
      type: object
      required: [skillId, categoryId, name, level]
      properties:
        skillId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        level:
          $ref: "#/components/schemas/SkillLevel"
    Profile:
      type: object
      description: The owner's view of the profile; it has no email, password or account status.
      required: [id, firstName, lastName, university, faculty, course, city, bio, formats,
        teachingSkills, learningSkills, eligibleForMatching]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        university:
          $ref: "#/components/schemas/Reference"
        faculty:
          allOf:
            - $ref: "#/components/schemas/Reference"
          nullable: true
        course:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
        city:
          type: string
          description: Empty string when not set.
        bio:
          type: string
          description: Plain text; clients must display it without interpreting HTML.
        formats:
          type: array
          items:
            $ref: "#/components/schemas/LessonFormat"
        teachingSkills:
          type: array
          description: The "I teach" list, ordered by skill name.
          items:
            $ref: "#/components/schemas/UserSkill"
        learningSkills:
          type: array
          description: The "I learn" list, ordered by skill name.
          items:
            $ref: "#/components/schemas/UserSkill"
        eligibleForMatching:
          type: boolean
          description: True when both lists are filled, a format is chosen, and offline has a city.
    ProfileEnvelope:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        universityId:
          type: string
          format: uuid
          description: A university from GET /universities. The account email is not changed.
        facultyId:
          type: string
          format: uuid
          nullable: true
          description: Must be a faculty of the resulting university.
        course:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
        city:
          type: string
          maxLength: 100
          nullable: true
        bio:
          type: string
          maxLength: 600
          nullable: true
          description: Up to 600 characters (not bytes); line breaks are allowed.
        formats:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/LessonFormat"
    AddSkillRequest:
      type: object
      additionalProperties: false
      required: [skillId, level]
      properties:
        skillId:
          type: string
          format: uuid
        level:
          $ref: "#/components/schemas/SkillLevel"
    SkillLevelRequest:
      type: object
      additionalProperties: false
      required: [level]
      properties:
        level:
          $ref: "#/components/schemas/SkillLevel"
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: olena.koval@students.example.test
        password:
          type: string
          minLength: 12
          description: 12+ characters, at most 72 UTF-8 bytes
        firstName:
          type: string
          maxLength: 100
          example: Олена
        lastName:
          type: string
          maxLength: 100
          example: Коваль
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        rememberMe:
          type: boolean
          default: false
          description: Persist the cookie for seven days. If false, the cookie expires when the browser closes.
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: The `token` query parameter from the email link
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 12
          description: 12+ characters, at most 72 UTF-8 bytes
    User:
      type: object
      required: [id, email, firstName, lastName, universityId, role, emailVerified, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        universityId:
          type: string
          format: uuid
        role:
          type: string
          enum: [STUDENT, ADMIN]
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    SessionResponse:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: Send as the X-CSRF-Token header on POST requests that need a session.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              description: Field-level messages, present only for validation_failed.
              additionalProperties:
                type: string
    StudentSummary:
      type: object
      description: Another student's public card; it has no email or account status.
      required: [id, firstName, lastName, university, city]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        university:
          $ref: "#/components/schemas/Reference"
        city:
          type: string
          description: Empty string when not set.
    MutualMatch:
      type: object
      required: [student, canTeachYou, wantsToLearn, commonFormats]
      properties:
        student:
          $ref: "#/components/schemas/StudentSummary"
        canTeachYou:
          type: array
          description: The student's teaching skills that you want to learn, with the student's level; ordered by name.
          items:
            $ref: "#/components/schemas/UserSkill"
        wantsToLearn:
          type: array
          description: Your teaching skills that the student wants to learn, with the student's current level; ordered by name.
          items:
            $ref: "#/components/schemas/UserSkill"
        commonFormats:
          type: array
          description: Formats you can use together; OFFLINE appears only when you share a city.
          items:
            $ref: "#/components/schemas/LessonFormat"
    MatchPage:
      type: object
      required: [items, page, pageSize, total, eligibleForMatching]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MutualMatch"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          description: Number of matches on all pages.
        eligibleForMatching:
          type: boolean
          description: False when your own profile lacks a skill list, a format, or a city for offline lessons.
    StudentCard:
      type: object
      required: [student, teachingSkills, formats, mutual]
      properties:
        student:
          $ref: "#/components/schemas/StudentSummary"
        teachingSkills:
          type: array
          description: All skills the student offers, ordered by name.
          items:
            $ref: "#/components/schemas/UserSkill"
        formats:
          type: array
          items:
            $ref: "#/components/schemas/LessonFormat"
        mutual:
          type: boolean
          description: True when the student is also your mutual match.
    StudentSearchPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StudentCard"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          description: Number of students on all pages.
    Review:
      type: object
      required: [id, author, rating, comment, createdAt]
      properties:
        id:
          type: string
          format: uuid
        author:
          type: object
          required: [id, firstName, lastName]
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            lastName:
              type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          description: Plain text; empty string when there is no comment.
        createdAt:
          type: string
          format: date-time
    StudentProfile:
      type: object
      required: [id, firstName, lastName, university, faculty, course, city, bio, formats,
        teachingSkills, learningSkills, averageRating, reviewCount, reviews, mutual]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        university:
          $ref: "#/components/schemas/Reference"
        faculty:
          allOf:
            - $ref: "#/components/schemas/Reference"
          type: object
          nullable: true
        course:
          type: integer
          nullable: true
        city:
          type: string
        bio:
          type: string
          description: Plain text; clients must display it without interpreting HTML.
        formats:
          type: array
          items:
            $ref: "#/components/schemas/LessonFormat"
        teachingSkills:
          type: array
          items:
            $ref: "#/components/schemas/UserSkill"
        learningSkills:
          type: array
          items:
            $ref: "#/components/schemas/UserSkill"
        averageRating:
          type: number
          nullable: true
        reviewCount:
          type: integer
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        mutual:
          type: object
          nullable: true
          required: [canTeachYou, wantsToLearn, commonFormats]
          properties:
            canTeachYou:
              type: array
              items:
                $ref: "#/components/schemas/UserSkill"
            wantsToLearn:
              type: array
              items:
                $ref: "#/components/schemas/UserSkill"
            commonFormats:
              type: array
              items:
                $ref: "#/components/schemas/LessonFormat"
    CreateExchangeRequest:
      type: object
      additionalProperties: false
      required: [recipientId, teachSkillId, learnSkillId, format, teachSessions, teachDurationMinutes,
        learnSessions, learnDurationMinutes]
      properties:
        recipientId:
          type: string
          format: uuid
        teachSkillId:
          type: string
          format: uuid
          description: Catalog skill id that you teach the recipient.
        learnSkillId:
          type: string
          format: uuid
          description: Catalog skill id that the recipient teaches you; differs from `teachSkillId`.
        format:
          $ref: "#/components/schemas/LessonFormat"
        teachSessions:
          type: integer
          minimum: 1
          maximum: 20
        teachDurationMinutes:
          type: integer
          minimum: 15
          maximum: 240
        learnSessions:
          type: integer
          minimum: 1
          maximum: 20
          description: "`learnSessions × learnDurationMinutes` must equal `teachSessions × teachDurationMinutes`."
        learnDurationMinutes:
          type: integer
          minimum: 15
          maximum: 240
        message:
          type: string
          maxLength: 500
          description: Plain text; spaces around it are trimmed and an empty message is stored as null.
    RequestStatus:
      type: string
      enum: [PENDING, ACCEPTED, DECLINED, WITHDRAWN]
    RequestTerms:
      type: object
      description: |
        One direction of the exchange. In a request the levels are the students' current
        ones; in an exchange the name and levels are those copied on acceptance.
      required: [skill, teacherLevel, learnerLevel, sessions, durationMinutes]
      properties:
        skill:
          type: object
          required: [skillId, categoryId, name]
          properties:
            skillId:
              type: string
              format: uuid
            categoryId:
              type: string
              format: uuid
            name:
              type: string
        teacherLevel:
          $ref: "#/components/schemas/SkillLevel"
        learnerLevel:
          $ref: "#/components/schemas/SkillLevel"
        sessions:
          type: integer
        durationMinutes:
          type: integer
    ExchangeRequest:
      type: object
      description: The same for both participants.
      required: [id, status, format, totalSessions, message, requester, recipient, requesterTeaches,
        recipientTeaches, exchangeId, createdAt, respondedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/RequestStatus"
        format:
          $ref: "#/components/schemas/LessonFormat"
        totalSessions:
          type: integer
          description: Sessions in both directions.
        message:
          type: string
          nullable: true
          description: Plain text; clients must display it without interpreting HTML.
        requester:
          $ref: "#/components/schemas/StudentSummary"
        recipient:
          $ref: "#/components/schemas/StudentSummary"
        requesterTeaches:
          $ref: "#/components/schemas/RequestTerms"
        recipientTeaches:
          $ref: "#/components/schemas/RequestTerms"
        exchangeId:
          type: string
          format: uuid
          nullable: true
          description: The exchange created when the request is accepted.
        createdAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
          nullable: true
    ExchangeStatus:
      type: string
      description: Every exchange starts ACTIVE and ends COMPLETED or CANCELLED; PLANNED and PAUSED are not used.
      enum: [PLANNED, ACTIVE, PAUSED, COMPLETED, CANCELLED]
    ExchangeProgress:
      type: object
      description: |
        Progress of an exchange relative to the agreed plan (FR-10, FR-11). Only sessions
        confirmed by both participants count as completed; cancelled sessions do not increase
        `completedSessions` or `percent`.
      required: [completedSessions, totalSessions, requesterCompletedSessions,
        requesterPlannedSessions, recipientCompletedSessions, recipientPlannedSessions,
        scheduledSessions, proposedSessions, draftSessions, cancelledSessions,
        awaitingConfirmationSessions, percent, planCompleted]
      properties:
        completedSessions:
          type: integer
          minimum: 0
        totalSessions:
          type: integer
          minimum: 1
        requesterCompletedSessions:
          type: integer
          minimum: 0
        requesterPlannedSessions:
          type: integer
          minimum: 1
        recipientCompletedSessions:
          type: integer
          minimum: 0
        recipientPlannedSessions:
          type: integer
          minimum: 1
        scheduledSessions:
          type: integer
          minimum: 0
        proposedSessions:
          type: integer
          minimum: 0
        draftSessions:
          type: integer
          minimum: 0
        cancelledSessions:
          type: integer
          minimum: 0
        awaitingConfirmationSessions:
          type: integer
          minimum: 0
          description: Scheduled sessions that have already ended and wait for confirmations.
        percent:
          type: integer
          minimum: 0
          maximum: 100
        planCompleted:
          type: boolean
          description: Every planned session in both directions is completed.
    NextSessionSummary:
      type: object
      description: The earliest upcoming `SCHEDULED` meeting of an exchange.
      required: [id, planOrder, title, status, format, startsAt, endsAt, teacher, learner,
        meetingPlace, meetingUrl]
      properties:
        id:
          type: string
          format: uuid
        planOrder:
          type: integer
          minimum: 1
        title:
          type: string
        status:
          $ref: "#/components/schemas/SessionStatus"
        format:
          $ref: "#/components/schemas/LessonFormat"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        teacher:
          $ref: "#/components/schemas/StudentSummary"
        learner:
          $ref: "#/components/schemas/StudentSummary"
        meetingPlace:
          type: string
          nullable: true
        meetingUrl:
          type: string
          nullable: true
    Exchange:
      type: object
      description: |
        `requesterTeaches` and `recipientTeaches` hold the skill name and levels copied on
        acceptance, not the current profile values. `partner` is the other student relative
        to the signed-in viewer. `canConfirmCompletion` is true for an active exchange with
        the whole plan done that the viewer has not confirmed yet.
      required: [id, requestId, status, format, totalSessions, partner, requester, recipient,
        requesterTeaches, recipientTeaches, progress, nextSession, completionConfirmedByMe,
        completionConfirmedByPartner, canConfirmCompletion, canCancel, startedAt, completedAt,
        cancelledAt, cancellationReason, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
          nullable: true
          description: The accepted request that started the exchange.
        status:
          $ref: "#/components/schemas/ExchangeStatus"
        format:
          $ref: "#/components/schemas/LessonFormat"
        totalSessions:
          type: integer
        partner:
          $ref: "#/components/schemas/StudentSummary"
        requester:
          $ref: "#/components/schemas/StudentSummary"
        recipient:
          $ref: "#/components/schemas/StudentSummary"
        requesterTeaches:
          $ref: "#/components/schemas/RequestTerms"
        recipientTeaches:
          $ref: "#/components/schemas/RequestTerms"
        progress:
          $ref: "#/components/schemas/ExchangeProgress"
        nextSession:
          allOf:
            - $ref: "#/components/schemas/NextSessionSummary"
          nullable: true
        completionConfirmedByMe:
          type: boolean
        completionConfirmedByPartner:
          type: boolean
        canConfirmCompletion:
          type: boolean
        canCancel:
          type: boolean
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ExchangePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Exchange"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
    SessionStatus:
      type: string
      enum: [DRAFT, PROPOSED, SCHEDULED, COMPLETED, CANCELLED]
    ScheduleProposalStatus:
      type: string
      enum: [PENDING, ACCEPTED, DECLINED, SUPERSEDED]
    SessionRole:
      type: string
      enum: [TEACHER, LEARNER]
    SessionProposal:
      type: object
      required: [id, sessionId, status, proposedBy, startsAt, endsAt, format, meetingPlace,
        meetingUrl, respondedBy, respondedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ScheduleProposalStatus"
        proposedBy:
          $ref: "#/components/schemas/Person"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        format:
          $ref: "#/components/schemas/LessonFormat"
        meetingPlace:
          type: string
          nullable: true
        meetingUrl:
          type: string
          nullable: true
        respondedBy:
          allOf:
            - $ref: "#/components/schemas/Person"
          nullable: true
        respondedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      description: |
        Lesson slot within an exchange (FR-09, FR-10). `partner` and `role` are computed
        relative to the signed-in viewer; `startsAt` and `endsAt` include the timezone
        offset.
      required: [id, exchangeId, planOrder, title, description, status, format, skill,
        plannedDurationMinutes, teacher, learner, partner, role, startsAt, endsAt,
        durationMinutes, meetingPlace, meetingUrl, activeProposal, scheduleConfirmedByMe,
        scheduleConfirmedByPartner, canRespondToProposal, canCancel, completionConfirmedByMe,
        completionConfirmedByPartner, canConfirmCompletion, completedAt, cancelledAt,
        cancellationReason, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        exchangeId:
          type: string
          format: uuid
        planOrder:
          type: integer
          minimum: 1
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/SessionStatus"
        format:
          $ref: "#/components/schemas/LessonFormat"
        skill:
          type: object
          required: [skillId, categoryId, name]
          properties:
            skillId:
              type: string
              format: uuid
            categoryId:
              type: string
              format: uuid
            name:
              type: string
        plannedDurationMinutes:
          type: integer
        teacher:
          $ref: "#/components/schemas/StudentSummary"
        learner:
          $ref: "#/components/schemas/StudentSummary"
        partner:
          $ref: "#/components/schemas/StudentSummary"
        role:
          $ref: "#/components/schemas/SessionRole"
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        meetingPlace:
          type: string
          nullable: true
        meetingUrl:
          type: string
          nullable: true
        activeProposal:
          allOf:
            - $ref: "#/components/schemas/SessionProposal"
          nullable: true
        scheduleConfirmedByMe:
          type: boolean
        scheduleConfirmedByPartner:
          type: boolean
        canRespondToProposal:
          type: boolean
        canCancel:
          type: boolean
        completionConfirmedByMe:
          type: boolean
        completionConfirmedByPartner:
          type: boolean
        canConfirmCompletion:
          type: boolean
          description: The session is `SCHEDULED`, has ended, and the viewer has not confirmed it yet.
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProposeSessionRequest:
      type: object
      additionalProperties: false
      required: [startsAt, endsAt]
      properties:
        sessionId:
          type: string
          format: uuid
          description: Optional specific session slot ID when calling `POST /exchanges/{exchangeId}/sessions`.
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Required on `POST /exchanges/{exchangeId}/sessions`; optional when updating an existing session.
        description:
          type: string
          maxLength: 1000
        teacherId:
          type: string
          format: uuid
          description: Must be one of the two exchange participants.
        startsAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp with timezone, in the future.
        endsAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp with timezone, 15 to 240 minutes after `startsAt`.
        format:
          $ref: "#/components/schemas/LessonFormat"
        meetingPlace:
          type: string
          maxLength: 180
          description: Required when `format` is `OFFLINE`; must be empty when `ONLINE`.
        meetingUrl:
          type: string
          maxLength: 500
          description: Required `http://` or `https://` link when `format` is `ONLINE`; must be empty when `OFFLINE`.
    CancelSessionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500
    CancelExchangeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: Змінився розклад занять
    SchedulePage:
      type: object
      required: [items, page, pageSize, total, timezone, pendingProposalsCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
        timezone:
          type: string
          example: Europe/Kyiv
        pendingProposalsCount:
          type: integer
          minimum: 0
    ExchangeRequestPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExchangeRequest"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          description: Number of requests on all pages.
    RequestStatusChange:
      type: object
      required: [status, changedBy, createdAt]
      properties:
        status:
          $ref: "#/components/schemas/RequestStatus"
        changedBy:
          type: object
          nullable: true
          description: The student who made the change; null when it was not made by a user.
          required: [id, firstName, lastName]
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            lastName:
              type: string
        createdAt:
          type: string
          format: date-time
    ExchangeStatusChange:
      type: object
      required: [status, changedBy, reason, createdAt]
      properties:
        status:
          $ref: "#/components/schemas/ExchangeStatus"
        changedBy:
          allOf:
            - $ref: "#/components/schemas/Person"
          nullable: true
          description: The student who made the change; null when it was not made by a user.
        reason:
          type: string
          nullable: true
          description: The cancellation reason.
        createdAt:
          type: string
          format: date-time
    Person:
      type: object
      required: [id, firstName, lastName]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
    ConversationType:
      type: string
      enum: [REQUEST, EXCHANGE]
    MessagePreview:
      type: object
      required: [id, author, body, createdAt]
      properties:
        id:
          type: string
          format: uuid
        author:
          allOf:
            - $ref: "#/components/schemas/Person"
          nullable: true
        body:
          type: string
          description: Plain text; clients must display it without interpreting HTML.
        createdAt:
          type: string
          format: date-time
    Conversation:
      type: object
      description: |
        Private chat between the two participants of a request or an exchange. `partner`
        is always the other student relative to the signed-in viewer.
      required: [id, type, requestId, exchangeId, requestStatus, exchangeStatus, format,
        partner, requester, recipient, requesterTeaches, recipientTeaches, lastMessage,
        lastMessageAt, unreadCount, canSend, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ConversationType"
        requestId:
          type: string
          format: uuid
          nullable: true
        exchangeId:
          type: string
          format: uuid
          nullable: true
        requestStatus:
          allOf:
            - $ref: "#/components/schemas/RequestStatus"
          nullable: true
        exchangeStatus:
          allOf:
            - $ref: "#/components/schemas/ExchangeStatus"
          nullable: true
        format:
          $ref: "#/components/schemas/LessonFormat"
        partner:
          $ref: "#/components/schemas/StudentSummary"
        requester:
          $ref: "#/components/schemas/StudentSummary"
        recipient:
          $ref: "#/components/schemas/StudentSummary"
        requesterTeaches:
          $ref: "#/components/schemas/RequestTerms"
        recipientTeaches:
          $ref: "#/components/schemas/RequestTerms"
        lastMessage:
          allOf:
            - $ref: "#/components/schemas/MessagePreview"
          nullable: true
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        unreadCount:
          type: integer
          minimum: 0
        canSend:
          type: boolean
          description: False when either student blocked the other or an account is no longer active.
        createdAt:
          type: string
          format: date-time
    ConversationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text up to 2000 characters; spaces around it are trimmed.
    Message:
      type: object
      required: [id, conversationId, author, type, body, createdAt, editedAt, readAt]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        author:
          allOf:
            - $ref: "#/components/schemas/Person"
          nullable: true
        type:
          type: string
          enum: [TEXT, SYSTEM]
        body:
          type: string
          description: Plain text; clients must display it without interpreting HTML.
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: string
          format: date-time
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
          description: When the other participant read the message.
    MessagePage:
      type: object
      required: [items, page, pageSize, total, pollIntervalSeconds]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
        pollIntervalSeconds:
          type: integer
          example: 5
          description: Recommended polling interval in seconds for an open chat (FR-08).
    NotificationEventType:
      type: string
      enum: [EXCHANGE_REQUEST, REQUEST_RESPONSE, CHAT_MESSAGE, SESSION_UPDATED]
    NotificationTarget:
      type: object
      description: Identifies the object to open when the user clicks the notification (FR-13).
      required: [kind, id, requestId, exchangeId, conversationId, sessionId]
      properties:
        kind:
          type: string
          enum: [EXCHANGE_REQUEST, EXCHANGE, CONVERSATION, SESSION]
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
          nullable: true
        exchangeId:
          type: string
          format: uuid
          nullable: true
        conversationId:
          type: string
          format: uuid
          nullable: true
        sessionId:
          type: string
          format: uuid
          nullable: true
    Notification:
      type: object
      required: [id, eventType, title, body, actor, target, requestId, exchangeId,
        conversationId, messageId, sessionId, isRead, readAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          $ref: "#/components/schemas/NotificationEventType"
        title:
          type: string
        body:
          type: string
          nullable: true
        actor:
          allOf:
            - $ref: "#/components/schemas/Person"
          nullable: true
        target:
          $ref: "#/components/schemas/NotificationTarget"
        requestId:
          type: string
          format: uuid
          nullable: true
        exchangeId:
          type: string
          format: uuid
          nullable: true
        conversationId:
          type: string
          format: uuid
          nullable: true
        messageId:
          type: string
          format: uuid
          nullable: true
        sessionId:
          type: string
          format: uuid
          nullable: true
        isRead:
          type: boolean
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    NotificationPage:
      type: object
      required: [items, page, pageSize, total, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          description: Number of notifications matching the filter across all pages.
        unreadCount:
          type: integer
          minimum: 0
          description: Total number of unread notifications for the signed-in user.
