openapi: 3.0.3
info:
  title: Skill Swap API
  version: 1.0.0
  description: |
    HTTP contract implemented by the Sprint 1-3 backend.

    Authentication (FR-01) uses an opaque server-side session stored in the HttpOnly
    `skillswap_session` cookie (SameSite=Lax, Path=/). Browsers should call the API through
    the frontend origin (the Next.js `/api/v1/*` rewrite) with `credentials: "include"`.

    Every POST, PATCH and DELETE must come from the configured frontend origin (`Origin`
    header) and send `Content-Type: application/json` when it has a body. Those requests
    that need a session must also send the `X-CSRF-Token` header returned by `/auth/login`
    and `/auth/me`.

    Profile endpoints (Sprint 3, FR-02 and FR-03) live under `/me`: the user always comes
    from the session, never from the path or the body. Every successful change returns the
    whole updated profile, so the client can replace its copy.
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local development
tags:
  - name: Service
  - name: Catalog
  - name: Auth
  - name: Profile
paths:
  /openapi.yaml:
    get:
      tags: [Service]
      operationId: getOpenAPI
      summary: Download this OpenAPI contract
      responses:
        "200":
          description: OpenAPI contract
          content:
            application/yaml:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/OriginForbidden"
  /health:
    get:
      tags: [Service]
      operationId: getHealth
      summary: Check whether the API process is running
      responses:
        "200":
          description: API process is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
        "403":
          $ref: "#/components/responses/OriginForbidden"
  /ready:
    get:
      tags: [Service]
      operationId: getReadiness
      summary: Check whether the database and required schema are available
      responses:
        "200":
          description: API is ready to serve database-backed requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
              example:
                status: ready
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /universities:
    get:
      tags: [Catalog]
      operationId: listUniversities
      summary: List universities ordered by name
      responses:
        "200":
          description: University catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/University"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /universities/{universityId}/faculties:
    get:
      tags: [Catalog]
      operationId: listFaculties
      summary: List faculties of a university ordered by name
      parameters:
        - name: universityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Faculties; an unknown university has none
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Faculty"
              example:
                items:
                  - id: 50000000-0000-0000-0000-000000000001
                    name: Факультет інформатики та обчислювальної техніки
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "404":
          description: universityId is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: not_found
                  message: Resource was not found
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /skill-categories:
    get:
      tags: [Catalog]
      operationId: listSkillCategories
      summary: List active skill categories in display order
      responses:
        "200":
          description: Skill category catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SkillCategory"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /skills:
    get:
      tags: [Catalog]
      operationId: listSkills
      summary: List or search active skills
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring matched against skill name or slug.
          required: false
          schema:
            type: string
            maxLength: 150
        - name: limit
          in: query
          description: Maximum number of returned skills.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Skill catalog
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"
        "400":
          description: Invalid q or limit query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidQuery:
                  value:
                    error:
                      code: invalid_query
                      message: q must be 150 characters or fewer
                invalidLimit:
                  value:
                    error:
                      code: invalid_limit
                      message: limit must be between 1 and 100
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create an account with a university email and send a verification link
      description: |
        The email is trimmed and lower-cased. Its domain must be listed in
        ALLOWED_EMAIL_DOMAINS and belong to a university. The password must have at least
        12 characters and at most 72 UTF-8 bytes; longer values are rejected, never truncated.
        The verification link points to `{FRONTEND_ORIGIN}/onboarding?token=...` and is valid
        for 24 hours. This call does not sign the user in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                required: [user, verificationEmailSent]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  verificationEmailSent:
                    type: boolean
                    description: False when SMTP failed; the user can sign in and resend the link.
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "409":
          description: The normalized email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: email_taken
                  message: An account with this email already exists
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in and receive the session cookie
      description: |
        Unverified users may sign in; `user.emailVerified` tells the frontend to show a
        verification reminder. After 5 failed attempts for one email within 15 minutes,
        sign-in for that email is locked for 2 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              description: "skillswap_session=...; Path=/; HttpOnly; SameSite=Lax. With rememberMe=true, also includes Max-Age=604800 and Expires."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          description: Email or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: invalid_credentials
                  message: Email or password is incorrect
        "403":
          description: Foreign origin (`origin_forbidden`) or suspended account (`account_suspended`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          description: Too many failed attempts
          headers:
            Retry-After:
              description: Seconds until sign-in is allowed again
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: login_locked
                  message: Too many failed attempts. Try again later
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Return the signed-in user and the CSRF token for this session
      description: Call this on page load to restore the session and obtain the CSRF token.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session and clear the cookie
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFOrOriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm the email address with the token from the verification link
      description: A token works once. Used, replaced, or expired tokens return `invalid_token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [verified]
        "400":
          $ref: "#/components/responses/InvalidToken"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Send a new verification link to the signed-in user
      description: The new link invalidates previously sent verification links.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "202":
          description: Email sent
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [sent]
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFOrOriginForbidden"
        "409":
          description: The email is already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: email_already_verified
                  message: Email is already verified
        "503":
          description: Database (`database_unavailable`) or SMTP (`mail_unavailable`) is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Send a password reset link if an active account exists
      description: |
        Always answers 202 for a well-formed email so the response does not reveal whether an
        account exists. The link points to `{FRONTEND_ORIGIN}/reset-password?token=...`, is valid
        for 1 hour, and invalidates earlier reset links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [accepted]
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with the token from the reset link
      description: |
        On success every session of the user is revoked and a login lockout is lifted.
        The user then signs in with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [password_reset]
        "400":
          $ref: "#/components/responses/InvalidToken"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/profile:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: Return the signed-in user's profile with both skill lists
      security:
        - sessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    patch:
      tags: [Profile]
      operationId: updateMyProfile
      summary: Change some profile fields (FR-02)
      description: |
        Send only the fields to change; missing fields stay as they are. `null` clears
        `facultyId`, `course`, `city`, `bio` and `formats`. The university comes from the
        account email and cannot be changed. The whole result is validated: `city` is
        required when `formats` contains `OFFLINE`.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
            example:
              firstName: Олена
              lastName: Коваль
              facultyId: 50000000-0000-0000-0000-000000000001
              course: 2
              city: Київ
              bio: Граю на гітарі 5 років, хочу навчитися Photoshop.
              formats: [ONLINE, OFFLINE]
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFOrOriginForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: One or more fields are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: validation_failed
                  message: Some fields are invalid
                  fields:
                    bio: Description must be at most 600 characters
                    city: City is required for offline lessons
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/teaching-skills:
    post:
      tags: [Profile]
      operationId: addTeachingSkill
      summary: Add a catalog skill to the "I teach" list
      description: "`level` is a self-assessment of the skill. A skill can be in each list once."
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/AddSkill"
      responses:
        "201":
          $ref: "#/components/responses/ProfileChanged"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFOrOriginForbidden"
        "404":
          $ref: "#/components/responses/SkillNotFound"
        "409":
          $ref: "#/components/responses/SkillAlreadyAdded"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidLevel"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/teaching-skills/{skillId}:
    parameters:
      - $ref: "#/components/parameters/SkillID"
    patch:
      tags: [Profile]
      operationId: updateTeachingSkillLevel
      summary: Change the level of a skill in the "I teach" list
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SkillLevel"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFOrOriginForbidden"
        "404":
          $ref: "#/components/responses/SkillNotInList"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidLevel"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    delete:
      tags: [Profile]
      operationId: removeTeachingSkill
      summary: Remove a skill from the "I teach" list
      description: The other list is not changed.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFOrOriginForbidden"
        "404":
          $ref: "#/components/responses/SkillNotInList"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/learning-skills:
    post:
      tags: [Profile]
      operationId: addLearningSkill
      summary: Add a catalog skill to the "I learn" list
      description: "`level` is the current level of knowledge. A skill can be in each list once."
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/AddSkill"
      responses:
        "201":
          $ref: "#/components/responses/ProfileChanged"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFOrOriginForbidden"
        "404":
          $ref: "#/components/responses/SkillNotFound"
        "409":
          $ref: "#/components/responses/SkillAlreadyAdded"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidLevel"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
  /me/learning-skills/{skillId}:
    parameters:
      - $ref: "#/components/parameters/SkillID"
    patch:
      tags: [Profile]
      operationId: updateLearningSkillLevel
      summary: Change the level of a skill in the "I learn" list
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      requestBody:
        $ref: "#/components/requestBodies/SkillLevel"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "400":
          $ref: "#/components/responses/InvalidJSON"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFOrOriginForbidden"
        "404":
          $ref: "#/components/responses/SkillNotInList"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidLevel"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
    delete:
      tags: [Profile]
      operationId: removeLearningSkill
      summary: Remove a skill from the "I learn" list
      description: The other list is not changed.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          $ref: "#/components/responses/Profile"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CSRFOrOriginForbidden"
        "404":
          $ref: "#/components/responses/SkillNotInList"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: skillswap_session
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: The `csrfToken` value from `/auth/login` or `/auth/me`.
      schema:
        type: string
    SkillID:
      name: skillId
      in: path
      required: true
      description: Catalog skill id (`Skill.id`), not a row id of the list.
      schema:
        type: string
        format: uuid
  requestBodies:
    AddSkill:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AddSkillRequest"
          example:
            skillId: 30000000-0000-0000-0000-000000000001
            level: ADVANCED
    SkillLevel:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SkillLevelRequest"
          example:
            level: INTERMEDIATE
  examples:
    Profile:
      value:
        profile:
          id: 40000000-0000-0000-0000-000000000001
          firstName: Олена
          lastName: Коваль
          university:
            id: 10000000-0000-0000-0000-000000000001
            name: Демонстраційний університет
          faculty:
            id: 50000000-0000-0000-0000-000000000001
            name: Факультет інформатики та обчислювальної техніки
          course: 2
          city: Київ
          bio: Граю на гітарі 5 років, хочу навчитися Photoshop.
          formats: [ONLINE, OFFLINE]
          teachingSkills:
            - skillId: 30000000-0000-0000-0000-000000000001
              categoryId: 20000000-0000-0000-0000-000000000001
              name: Гітара
              level: ADVANCED
          learningSkills:
            - skillId: 30000000-0000-0000-0000-000000000002
              categoryId: 20000000-0000-0000-0000-000000000002
              name: Photoshop
              level: BEGINNER
          eligibleForMatching: true
  responses:
    Profile:
      description: The current profile
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileEnvelope"
          examples:
            profile:
              $ref: "#/components/examples/Profile"
    ProfileChanged:
      description: The skill was added; the body is the updated profile
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileEnvelope"
          examples:
            profile:
              $ref: "#/components/examples/Profile"
    SkillNotFound:
      description: The skill is not in the catalog, is inactive, or `skillId` is not a UUID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: skill_not_found
              message: Skill was not found in the catalog
    SkillNotInList:
      description: The skill is not in this list of the signed-in user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: skill_not_found
              message: Skill is not in this list
    SkillAlreadyAdded:
      description: The skill is already in this list
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: skill_already_added
              message: Skill is already in this list
    InvalidLevel:
      description: The level is not one of the allowed values
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: validation_failed
              message: Some fields are invalid
              fields:
                level: Level must be BEGINNER, INTERMEDIATE or ADVANCED
    Unauthenticated:
      description: The session cookie is missing, expired, or revoked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthenticated
              message: Sign in to continue
    CSRFOrOriginForbidden:
      description: Missing or wrong X-CSRF-Token (`csrf_invalid`) or foreign origin (`origin_forbidden`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: csrf_invalid
              message: CSRF token is missing or invalid
    InvalidJSON:
      description: The body is not a single JSON object with the documented fields
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: invalid_json
              message: Request body must be a valid JSON object
    UnsupportedMediaType:
      description: The body is not sent as application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unsupported_media_type
              message: Content-Type must be application/json
    ValidationFailed:
      description: One or more fields are invalid; `fields` maps each field name to a message
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: validation_failed
              message: Some fields are invalid
              fields:
                password: Password must contain at least 12 characters
    InvalidToken:
      description: The link token is malformed, already used, replaced, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: invalid_token
              message: The link is invalid, already used, or expired
    OriginForbidden:
      description: Request Origin does not match the configured frontend origin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: origin_forbidden
              message: Origin is not allowed
    DatabaseUnavailable:
      description: PostgreSQL is unavailable or the required schema has not been applied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: database_unavailable
              message: Database is unavailable
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Readiness:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    University:
      type: object
      required: [id, name, shortName, emailDomain, city]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortName:
          type: string
        emailDomain:
          type: string
        city:
          type: string
    SkillCategory:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    Skill:
      type: object
      required: [id, categoryId, name, slug]
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
    Faculty:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    Reference:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    SkillLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    LessonFormat:
      type: string
      enum: [ONLINE, OFFLINE]
    UserSkill:
      type: object
      required: [skillId, categoryId, name, level]
      properties:
        skillId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        name:
          type: string
        level:
          $ref: "#/components/schemas/SkillLevel"
    Profile:
      type: object
      description: The owner's view of the profile; it has no email, password or account status.
      required: [id, firstName, lastName, university, faculty, course, city, bio, formats,
        teachingSkills, learningSkills, eligibleForMatching]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        university:
          $ref: "#/components/schemas/Reference"
        faculty:
          allOf:
            - $ref: "#/components/schemas/Reference"
          nullable: true
        course:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
        city:
          type: string
          description: Empty string when not set.
        bio:
          type: string
          description: Plain text; clients must display it without interpreting HTML.
        formats:
          type: array
          items:
            $ref: "#/components/schemas/LessonFormat"
        teachingSkills:
          type: array
          description: The "I teach" list, ordered by skill name.
          items:
            $ref: "#/components/schemas/UserSkill"
        learningSkills:
          type: array
          description: The "I learn" list, ordered by skill name.
          items:
            $ref: "#/components/schemas/UserSkill"
        eligibleForMatching:
          type: boolean
          description: True when both lists are filled, a format is chosen, and offline has a city.
    ProfileEnvelope:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/Profile"
    ProfileUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        facultyId:
          type: string
          format: uuid
          nullable: true
          description: Must be a faculty of the user's university.
        course:
          type: integer
          minimum: 1
          maximum: 6
          nullable: true
        city:
          type: string
          maxLength: 100
          nullable: true
        bio:
          type: string
          maxLength: 600
          nullable: true
          description: Up to 600 characters (not bytes); line breaks are allowed.
        formats:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/LessonFormat"
    AddSkillRequest:
      type: object
      additionalProperties: false
      required: [skillId, level]
      properties:
        skillId:
          type: string
          format: uuid
        level:
          $ref: "#/components/schemas/SkillLevel"
    SkillLevelRequest:
      type: object
      additionalProperties: false
      required: [level]
      properties:
        level:
          $ref: "#/components/schemas/SkillLevel"
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: olena.koval@students.example.test
        password:
          type: string
          minLength: 12
          description: 12+ characters, at most 72 UTF-8 bytes
        firstName:
          type: string
          maxLength: 100
          example: Олена
        lastName:
          type: string
          maxLength: 100
          example: Коваль
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        rememberMe:
          type: boolean
          default: false
          description: Persist the cookie for seven days. If false, the cookie expires when the browser closes.
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: The `token` query parameter from the email link
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 12
          description: 12+ characters, at most 72 UTF-8 bytes
    User:
      type: object
      required: [id, email, firstName, lastName, universityId, role, emailVerified, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        universityId:
          type: string
          format: uuid
        role:
          type: string
          enum: [STUDENT, ADMIN]
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    SessionResponse:
      type: object
      required: [user, csrfToken]
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: Send as the X-CSRF-Token header on POST requests that need a session.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              description: Field-level messages, present only for validation_failed.
              additionalProperties:
                type: string
